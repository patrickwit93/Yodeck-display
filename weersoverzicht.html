<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1465">
  <title>Weersoverzicht — Amstelland Ingenieurs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden; background: #111;
    }

    .screen {
      width: 1465px; height: 962px;
      transform-origin: top left;
      display: flex; flex-direction: column;
      font-family: 'Montserrat', 'Calibri Light', Arial, sans-serif;
      background: #1A1A18;
      color: #FFF;
      overflow: hidden;
    }

    /* ════════════════ TEGEL-GRID ════════════════ */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      padding: 14px;
    }

    /* ════════════════ TEGEL ════════════════ */
    .tile {
      background: #232321;
      border-radius: 10px;
      border-left: 4px solid #E4032D;
      padding: 18px 20px 16px;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .tile::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 160px; height: 160px;
      background: radial-gradient(circle at top left, rgba(228,3,45,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Tegel kop ── */
    .tile-head {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 9px;
    }
    .city-name {
      font-size: 17px; font-weight: 700;
      color: #E4032D; letter-spacing: 2px;
      text-transform: uppercase; line-height: 1.1;
    }
    .city-region {
      font-size: 9px; color: #484848;
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-top: 3px;
    }
    .weather-icon-big {
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
      margin-top: -4px;
      flex-shrink: 0;
    }

    /* ── Temperatuur ── */
    .temp-row {
      display: flex; align-items: baseline;
      gap: 5px; margin-bottom: 2px;
    }
    .temperature {
      font-size: 74px; font-weight: 300;
      line-height: 0.9; color: #FFF;
    }
    .temp-unit { font-size: 28px; color: #E4032D; }
    .feels-like { font-size: 12px; color: #484848; margin-bottom: 7px; margin-top: 5px; }

    .weather-desc {
      font-size: 14px; font-weight: 300;
      color: #D9D9D9; letter-spacing: 0.3px;
    }

    /* ── Divider ── */
    .div { height: 1px; margin: 9px 0;
      background: linear-gradient(to right, #E4032D 0%, rgba(228,3,45,0.2) 50%, transparent 100%); }

    /* ── Stats balk ── */
    .stats {
      display: flex; gap: 0;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      padding-right: 8px;
    }
    .stat-label {
      font-size: 9px; color: #484848;
      text-transform: uppercase; letter-spacing: .8px;
      margin-bottom: 4px; white-space: nowrap;
    }
    .stat-value {
      font-size: 13px; font-weight: 600;
      color: #D9D9D9; white-space: nowrap;
    }

    /* ── Forecast ── */
    .forecast-section { margin-top: auto; padding-top: 12px; }
    .forecast-label {
      font-size: 9px; color: #484848;
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 9px;
    }
    .forecast-row { display: flex; gap: 5px; }
    .fc-item {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 7px;
      padding: 10px 5px 9px;
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
    }
    .fc-day  { font-size: 10px; color: #616160; letter-spacing: .8px; text-transform: uppercase; font-weight: 600; }
    .fc-icon { display: flex; align-items: center; justify-content: center; }
    .fc-temps { display: flex; gap: 5px; align-items: baseline; }
    .fc-hi { font-size: 14px; font-weight: 700; color: #FFF; }
    .fc-lo { font-size: 12px; color: #484848; }

    /* ════════════════ STATUSREGEL (geen header/logo — dat regelt Yodeck) ════════════════ */
    .footer {
      height: 36px; flex-shrink: 0;
      background: #141412; border-top: 1px solid #2A2A28;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .footer-left { display: flex; align-items: center; gap: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #E4032D; animation: blink 2.5s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.2;transform:scale(.7)} }
    .footer-txt  { font-size: 11px; color: #484848; letter-spacing: .5px; }
    .footer-src  { font-size: 10px; color: #333; letter-spacing: 1px; }

    /* ════════════════ LOADING / ERROR ════════════════ */
    .state-c { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
    .spinner { width:28px; height:28px; border:2px solid #2A2A28; border-top-color:#E4032D; border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .state-lbl { font-size:11px; color:#484848; letter-spacing:1px; text-transform:uppercase; }
    .state-err { color:#E4032D; }
  </style>
</head>
<body>
<div class="screen" id="screen">

  <!-- ── TEGEL GRID ── -->
  <div class="grid" id="grid"></div>

  <!-- ── STATUSREGEL ── -->
  <footer class="footer">
    <div class="footer-left">
      <div class="dot"></div>
      <span class="footer-txt" id="status-text">Weerdata laden…</span>
    </div>
    <span class="footer-src">Open-Meteo.com &nbsp;·&nbsp; Amstelland Ingenieurs</span>
  </footer>

</div>

<script>
// ── Locaties ────────────────────────────────────────
const LOCATIONS = [
  { name: 'Aalsmeer',       region: 'Noord-Holland', lat: 52.263, lon: 4.762 },
  { name: 'Alkmaar',        region: 'Noord-Holland', lat: 52.631, lon: 4.748 },
  { name: 'Amersfoort',     region: 'Utrecht',       lat: 52.156, lon: 5.388 },
  { name: 'Geertruidenberg',region: 'Noord-Brabant', lat: 51.701, lon: 4.856 },
  { name: 'Halfweg',        region: 'Noord-Holland', lat: 52.381, lon: 4.736 },
  { name: 'Heemskerk',      region: 'Noord-Holland', lat: 52.509, lon: 4.681 },
  { name: 'Jisp',           region: 'Noord-Holland', lat: 52.469, lon: 4.954 },
  { name: 'Nijkerk',        region: 'Gelderland',    lat: 52.215, lon: 5.489 },
];

const REFRESH_MS = 10 * 60 * 1000;

// ── SVG weericons (inline, geen externe afhankelijkheid) ─
const SVG_ICONS = {

      <rect x="30" y="3" width="4" height="10" rx="2" transform="rotate(180,32,32)"/>
      <rect x="30" y="3" width="4" height="10" rx="2" transform="rotate(225,32,32)"/>
      <rect x="30" y="3" width="4" height="10" rx="2" transform="rotate(270,32,32)"/>
      <rect x="30" y="3" width="4" height="10" rx="2" transform="rotate(315,32,32)"/>
    </g>
    <circle cx="32" cy="32" r="14" fill="#FFD700"/>
  </svg>`,

  mostly_sunny: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <g fill="#FFD700" opacity="0.95">
      <rect x="19" y="2" width="3.5" height="9" rx="1.75" transform="rotate(0,21,21)"/>
      <rect x="19" y="2" width="3.5" height="9" rx="1.75" transform="rotate(45,21,21)"/>
      <rect x="19" y="2" width="3.5" height="9" rx="1.75" transform="rotate(90,21,21)"/>
      <rect x="19" y="2" width="3.5" height="9" rx="1.75" transform="rotate(135,21,21)"/>
      <rect x="19" y="2" width="3.5" height="9" rx="1.75" transform="rotate(180,21,21)"/>
      <rect x="19" y="2" width="3.5" height="9" rx="1.75" transform="rotate(225,21,21)"/>
      <rect x="19" y="2" width="3.5" height="9" rx="1.75" transform="rotate(270,21,21)"/>
      <rect x="19" y="2" width="3.5" height="9" rx="1.75" transform="rotate(315,21,21)"/>
    </g>
    <circle cx="21" cy="21" r="10" fill="#FFD700"/>
    <path d="M16,43 Q10,43 10,37 Q10,31 16,31 Q17,25 24,25 Q33,25 35,31 Q41,31 41,37 Q41,44 34,44 Z" fill="#BDC8CE"/>
  </svg>`,

  partly_cloudy: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <circle cx="23" cy="23" r="14" fill="#FFD700"/>
    <path d="M14,46 Q8,46 8,39 Q8,33 14,33 Q15,27 22,27 Q31,27 34,33 Q41,33 41,39 Q41,46 34,46 Z" fill="#B0BEC5"/>
  </svg>`,

  cloudy: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <path d="M8,36 Q2,36 2,29 Q2,22 9,22 Q11,15 20,15 Q31,15 34,22 Q42,22 42,29 Q42,37 33,37 Z" fill="#78909C"/>
    <path d="M22,50 Q15,50 15,44 Q15,38 22,38 Q23,32 30,32 Q39,32 41,38 Q47,38 47,44 Q47,51 39,51 Z" fill="#B0BEC5"/>
  </svg>`,

  fog: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <path d="M8,20 Q4,20 4,16 Q4,12 8,12 Q9,9 13,9 Q20,9 21,13 Q26,13 26,17 Q26,21 20,21 Z" fill="#78909C" opacity="0.55"/>
    <rect x="5"  y="27" width="54" height="5" rx="2.5" fill="#78909C" opacity="0.65"/>
    <rect x="9"  y="36" width="46" height="5" rx="2.5" fill="#78909C" opacity="0.48"/>
    <rect x="13" y="45" width="38" height="5" rx="2.5" fill="#78909C" opacity="0.32"/>
  </svg>`,

  drizzle: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <path d="M9,31 Q3,31 3,24 Q3,17 10,17 Q12,10 21,10 Q32,10 35,17 Q43,17 43,24 Q43,32 34,32 Z" fill="#90A4AE"/>
    <g fill="#5C9BD6" opacity="0.85">
      <ellipse cx="18" cy="44" rx="2.5" ry="4"/>
      <ellipse cx="29" cy="49" rx="2.5" ry="4"/>
      <ellipse cx="40" cy="44" rx="2.5" ry="4"/>
    </g>
  </svg>`,

  rain: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <path d="M9,30 Q3,30 3,23 Q3,16 10,16 Q12,9 21,9 Q32,9 35,16 Q43,16 43,23 Q43,31 34,31 Z" fill="#607D8B"/>
    <g fill="#4A90D9">
      <ellipse cx="14" cy="41" rx="2.5" ry="4.5"/>
      <ellipse cx="23" cy="48" rx="2.5" ry="4.5"/>
      <ellipse cx="32" cy="41" rx="2.5" ry="4.5"/>
      <ellipse cx="41" cy="48" rx="2.5" ry="4.5"/>
    </g>
  </svg>`,

  snow: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <path d="M9,30 Q3,30 3,23 Q3,16 10,16 Q12,9 21,9 Q32,9 35,16 Q43,16 43,23 Q43,31 34,31 Z" fill="#78909C"/>
    <g fill="#E3F2FD">
      <circle cx="14" cy="42" r="3.5"/>
      <circle cx="25" cy="51" r="3.5"/>
      <circle cx="36" cy="42" r="3.5"/>
      <circle cx="47" cy="51" r="3.5"/>
    </g>
  </svg>`,

  sleet: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <path d="M9,30 Q3,30 3,23 Q3,16 10,16 Q12,9 21,9 Q32,9 35,16 Q43,16 43,23 Q43,31 34,31 Z" fill="#78909C"/>
    <ellipse cx="14" cy="41" rx="2.5" ry="4"   fill="#4A90D9"/>
    <circle  cx="25" cy="51" r="3.5"            fill="#E3F2FD"/>
    <ellipse cx="36" cy="41" rx="2.5" ry="4"   fill="#4A90D9"/>
    <circle  cx="47" cy="51" r="3.5"            fill="#E3F2FD"/>
  </svg>`,

  thunderstorm: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <path d="M9,28 Q3,28 3,21 Q3,14 10,14 Q12,7 21,7 Q32,7 35,14 Q43,14 43,21 Q43,29 34,29 Z" fill="#455A64"/>
    <polygon points="29,31 21,47 29,44 24,60 38,41 30,44" fill="#FFD700"/>
  </svg>`,

  warning: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <polygon points="32,5 61,59 3,59" fill="none" stroke="#E4032D" stroke-width="4" stroke-linejoin="round"/>
    <rect x="29.5" y="23" width="5" height="18" rx="2.5" fill="#E4032D"/>
    <circle cx="32" cy="50" r="3.5" fill="#E4032D"/>
  </svg>`,

  default: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="26" fill="none" stroke="#546E7A" stroke-width="2.5"/>
    <text x="32" y="42" text-anchor="middle" font-size="30" fill="#546E7A" font-family="Arial,sans-serif" font-weight="bold">?</text>
  </svg>`
};

// ── Render SVG als <img> via data-URI ───────────────
function weatherImg(key, size) {
  const svg = SVG_ICONS[key] || SVG_ICONS.default;
  const uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return `<img src="${uri}" width="${size}" height="${size}" style="display:block">`;
}

// ── WMO-code → beschrijving (NL) ───────────────────
function wmoDesc(code) {
  if (code === 0)   return 'Helder';
  if (code === 1)   return 'Overwegend helder';
  if (code === 2)   return 'Gedeeltelijk bewolkt';
  if (code === 3)   return 'Bewolkt';
  if (code <= 49)   return 'Mist';
  if (code <= 55)   return 'Motregen';
  if (code <= 65)   return 'Regen';
  if (code <= 77)   return 'Sneeuw';
  if (code <= 82)   return 'Buien';
  if (code <= 86)   return 'Sneeuwbuien';
  return 'Onweer';
}

// ── WMO-code → icon-sleutel ─────────────────────────
function wmoKey(code) {
  if (code === 0)   return 'sunny';
  if (code === 1)   return 'mostly_sunny';
  if (code === 2)   return 'partly_cloudy';
  if (code === 3)   return 'cloudy';
  if (code <= 48)   return 'fog';
  if (code <= 55)   return 'drizzle';
  if (code <= 65)   return 'rain';
  if (code <= 77)   return 'snow';
  if (code <= 82)   return 'rain';
  if (code <= 86)   return 'sleet';
  return 'thunderstorm';
}

// ── Windroos (graden → kompasrichting) ─────────────
function windRichting(deg) {
  if (deg == null) return '—';
  const r = ['N','NNO','NO','ONO','O','OZO','ZO','ZZO','Z','ZZW','ZW','WZW','W','WNW','NW','NNW'];
  return r[Math.round(deg / 22.5) % 16];
}

// ── Hulpfuncties ────────────────────────────────────
const R = n => Math.round(n);

function dagNaam(isoStr, index) {
  if (index === 1) return 'Morgen';
  const d = new Date(isoStr);
  return ['Zo','Ma','Di','Wo','Do','Vr','Za'][d.getDay()];
}

// ── Schaal aanpassing ───────────────────────────────
function fitScreen() {
  const s = document.getElementById('screen');
  const sx = window.innerWidth/1465, sy = window.innerHeight/962;
  const sc = Math.min(sx, sy);
  s.style.transform = `scale(${sc})`;
  s.style.marginLeft = ((window.innerWidth  - 1465*sc)/2)+'px';
  s.style.marginTop  = ((window.innerHeight - 962*sc)/2)+'px';
}

// ── HTML builders ───────────────────────────────────
function loadingTile(loc) {
  return `<div class="tile">
    <div class="tile-head">
      <div><div class="city-name">${loc.name}</div><div class="city-region">${loc.region}</div></div>
    </div>
    <div class="state-c"><div class="spinner"></div><span class="state-lbl">Laden…</span></div>
  </div>`;
}

function errorTile(loc) {
  return `<div class="tile">
    <div class="tile-head">
      <div><div class="city-name">${loc.name}</div><div class="city-region">${loc.region}</div></div>
    </div>
    <div class="state-c">
      <div style="width:44px;height:44px">${weatherImg('warning', 44)}</div>
      <span class="state-lbl state-err">Geen verbinding</span>
    </div>
  </div>`;
}

function safeR(val) {
  const n = parseFloat(val);
  return isNaN(n) ? '—' : Math.round(n);
}

function buildTile(loc, cur, daily) {
  const icon     = wmoKey(cur.weather_code);
  const temp     = cur.temperature_2m       != null ? R(cur.temperature_2m)       : '—';
  const feelTemp = cur.apparent_temperature  != null ? R(cur.apparent_temperature)  : '—';
  const humidity = cur.relative_humidity_2m  != null ? cur.relative_humidity_2m     : '—';
  const windkmh  = cur.wind_speed_10m        != null ? R(cur.wind_speed_10m)        : '—';
  const windDir  = windRichting(cur.wind_direction_10m);
  const neerslag = cur.precipitation         != null ? cur.precipitation.toFixed(1) + ' mm' : '—';
  const desc     = wmoDesc(cur.weather_code);

  const fcHTML = daily
    ? [1,2,3,4].map(i => `
        <div class="fc-item">
          <div class="fc-day">${dagNaam(daily.time[i], i)}</div>
          <div class="fc-icon">${weatherImg(wmoKey(daily.weather_code[i]), 26)}</div>
          <div class="fc-temps">
            <span class="fc-hi">${safeR(daily.temperature_2m_max[i])}°</span>
            <span class="fc-lo">${safeR(daily.temperature_2m_min[i])}°</span>
          </div>
        </div>`).join('')
    : [1,2,3,4].map(() => `
        <div class="fc-item">
          <div class="fc-icon" style="font-size:16px;margin:auto">—</div>
        </div>`).join('');

  return `<div class="tile">
    <div class="tile-head">
      <div>
        <div class="city-name">${loc.name}</div>
        <div class="city-region">${loc.region}</div>
      </div>
      <div class="weather-icon-big">${weatherImg(icon, 60)}</div>
    </div>

    <div class="temp-row">
      <div class="temperature">${temp}</div>
      <div class="temp-unit">°C</div>
    </div>
    <div class="feels-like">Voelt als ${feelTemp}°C</div>
    <div class="weather-desc">${desc}</div>

    <div class="div"></div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Wind</span>
        <span class="stat-value">${windkmh} km/u ${windDir}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Vochtigheid</span>
        <span class="stat-value">${humidity}%</span>
      </div>
      <div class="stat">
        <span class="stat-label">Neerslag (uur)</span>
        <span class="stat-value">${neerslag}</span>
      </div>
    </div>

    <div class="forecast-section">
      <div class="div"></div>
      <div class="forecast-label">4-daagse verwachting · Open-Meteo</div>
      <div class="forecast-row">${fcHTML}</div>
    </div>
  </div>`;
}

// ── API: Open-Meteo (huidig weer + verwachting) ──────
async function fetchWeather(loc) {
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${loc.lat}&longitude=${loc.lon}`
    + '&current=temperature_2m,apparent_temperature,relative_humidity_2m'
    + ',weather_code,wind_speed_10m,wind_direction_10m,precipitation'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min'
    + '&wind_speed_unit=kmh'
    + '&timezone=Europe%2FAmsterdam&forecast_days=5';
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── Render ──────────────────────────────────────────
function renderPlaceholders() {
  document.getElementById('grid').innerHTML = LOCATIONS.map(loadingTile).join('');
}

async function loadAll() {
  const tiles = Array.from(document.getElementById('grid').querySelectorAll('.tile'));

  await Promise.all(LOCATIONS.map(async (loc, i) => {
    await new Promise(res => setTimeout(res, i * 150));
    try {
      const data = await fetchWeather(loc);
      const w = document.createElement('div');
      w.innerHTML = buildTile(loc, data.current, data.daily);
      tiles[i].replaceWith(w.firstElementChild);
    } catch(e) {
      console.warn(loc.name, e);
      const w = document.createElement('div');
      w.innerHTML = errorTile(loc);
      tiles[i].replaceWith(w.firstElementChild);
    }
  }));

  const t = new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('status-text').textContent =
    `Bijgewerkt om ${t} · Volgende verversing over 10 minuten`;
}

// ── Start ───────────────────────────────────────────
fitScreen();
window.addEventListener('resize', fitScreen);
renderPlaceholders();
loadAll();
setInterval(() => { renderPlaceholders(); loadAll(); }, REFRESH_MS);
</script>
</body>
</html>
