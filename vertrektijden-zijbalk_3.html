<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vertrektijden – Halfweg-Zwanenburg</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --geel:    #FFC917;
      --rood:    #E4032D;
      --zwart:   #101010;
      --grijs-m: #8A8A88;
      --wit:     #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--zwart); font-size: 2.15vh; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      font-family: 'Montserrat', Arial, sans-serif;
      color: var(--wit);
      background: var(--zwart);
    }

    .screen { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 1.5rem 1.1rem 1rem; }

    /* ══ KOP ═══════════════════════════════════════════════════════ */
    .kop { display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; flex-shrink: 0; border-bottom: 3px solid var(--geel); padding-bottom: .8rem; }
    .kop-icoon {
      width: 2.1rem; height: 2.1rem; border-radius: .5rem; flex-shrink: 0;
      background: rgba(255,201,23,.16); display: flex; align-items: center; justify-content: center;
    }
    .kop-tekst { min-width: 0; }
    .kop-titel { font-size: 1.05rem; font-weight: 800; color: #fff; letter-spacing: .04em; text-transform: uppercase; }
    .kop-station { font-size: .68rem; color: rgba(255,255,255,.5); font-weight: 600; margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ══ KOLOMKOP ══════════════════════════════════════════════════ */
    .col-head {
      display: grid; grid-template-columns: 1fr 3.4rem 4.6rem;
      padding: 0 .3rem; margin-bottom: .4rem; flex-shrink: 0;
    }
    .col-head span {
      font-size: .6rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: rgba(255,255,255,.4);
    }
    .col-head span.c { text-align: center; }
    .col-head span.r { text-align: right; }

    /* ══ LIJST ═════════════════════════════════════════════════════ */
    .lijst { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; scrollbar-width: none; }
    .lijst::-webkit-scrollbar { display: none; }

    .row {
      flex: 0 0 auto;
      display: grid; grid-template-columns: 1fr 3.4rem 4.6rem; align-items: center;
      padding: .78rem .3rem;
      border-bottom: 1px solid rgba(255,255,255,.09);
    }
    .row.x { opacity: .5; }

    /* Over (aftellen — eerst minuten, onder de minuut in seconden) */
    .cell-tijd { display: flex; align-items: baseline; justify-content: flex-end; gap: .3rem; line-height: 1.1; }
    .tijd-nu { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .tijd-nu.vertraagd { color: var(--rood); }
    .tijd-nu.nul { color: var(--rood); }
    .tijd-unit { font-size: .72rem; font-weight: 700; color: rgba(255,255,255,.55); }
    .tijd-nu.geannuleerd { color: var(--grijs-m); text-decoration: line-through; }

    /* Richting */
    .cell-dir { min-width: 0; padding: 0 .8rem; }
    .dir-naam-wrap { overflow: hidden; }
    .dir-naam { font-size: 1.4rem; font-weight: 700; white-space: nowrap; display: inline-block; }
    .dir-naam.geannuleerd { text-decoration: line-through; color: var(--grijs-m); }
    /* De scroll-animatie zelf wordt per rij dynamisch toegevoegd in JS,
       omdat de pauzeduur (vast, 5s) en de reisafstand (per naam anders)
       samen een uniek percentage in de keyframes opleveren. */
    .dir-status { font-size: .78rem; font-weight: 700; color: var(--rood); text-transform: uppercase; letter-spacing: .02em; margin-top: .05rem; }
    .dir-status.rijdt-niet { color: var(--grijs-m); }

    /* Spoor */
    .cell-spoor { display: flex; align-items: center; justify-content: center; }
    .spoor-chip {
      min-width: 2.1rem; text-align: center;
      background: var(--geel);
      color: #1a1a1a;
      border-radius: .3rem;
      padding: .22rem .3rem;
      font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .row.x .spoor-chip { background: rgba(255,255,255,.15); color: rgba(255,255,255,.5); }

    /* ══ VOET ══════════════════════════════════════════════════════ */
    .voet { flex-shrink: 0; margin-top: .7rem; text-align: right; }
    .stxt { font-size: .64rem; color: rgba(255,255,255,.35); font-weight: 500; }
    .stxt.fout { color: #ff5a72; }

    .laden-punt { width: .9rem; height: .9rem; flex-shrink: 0; border: .13rem solid rgba(255,255,255,.15); border-top-color: var(--geel); border-radius: 50%; animation: draaien .7s linear infinite; margin: .2rem 0; }
    @keyframes draaien { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <script>
    // ╔════════════════════════════════════════════════════════════════╗
    // ║  CONFIGURATIE                                                  ║
    // ║  Route A — Yodeck-URL: ...bestand.html?nsapikey=JOUW_SLEUTEL   ║
    // ║  Route B — vast in dit bestand: vul NS_API_KEY hieronder in    ║
    // ╚════════════════════════════════════════════════════════════════╝
    function nsSleutelUitUrl() {
      try { return new URLSearchParams(window.location.search).get('nsapikey') || ''; } catch { return ''; }
    }
    const NS_API_KEY   = '8a4e5ff007914724aee958afa0481ea6';
    const STATION_CODE = 'HWZB';
    const STATION_NAAM = 'Halfweg-Zwanenburg';
    const MAX_ROWS     = 7;
    const REFRESH_MS   = 60000;
  </script>

  <div class="screen">
    <div class="kop">
      <div class="kop-icoon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFC917" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4 7h16M4 17h16"/><circle cx="8" cy="12" r="1.2" fill="#FFC917" stroke="none"/><circle cx="16" cy="12" r="1.2" fill="#FFC917" stroke="none"/></svg>
      </div>
      <div class="kop-tekst">
        <div class="kop-titel">Vertrektijden</div>
        <div class="kop-station">Halfweg-Zwanenburg</div>
      </div>
    </div>

    <div class="col-head">
      <span>Richting</span>
      <span class="c">Spoor</span>
      <span class="r">Over</span>
    </div>

    <div class="lijst" id="lijst"></div>

    <div class="voet">
      <span class="stxt" id="stxt">Opstarten…</span>
    </div>
  </div>

  <script>
    /* ══ HELPERS ══ */
    const pad = n => String(n).padStart(2, '0');

    function resterendMs(iso) {
      if (!iso) return null;
      return Math.max(0, new Date(iso) - Date.now());
    }
    function delayMin(p, a) {
      if (!p || !a) return 0;
      return Math.round((new Date(a) - new Date(p)) / 60000);
    }
    function setStatus(t, m) {
      const el = document.getElementById('stxt');
      el.textContent = t;
      el.className = 'stxt' + (m === 'fout' ? ' fout' : '');
    }

    // Boven de minuut: aftellen in minuten. Onder de minuut: aftellen in
    // seconden, zodat het echt op tikken lijkt vlak voor vertrek. Op 0: rood.
    function tijdWeergave(ms, vertraagd) {
      if (ms === null) return { getal: '–', eenheid: '', rood: false };
      if (ms <= 0) return { getal: '0', eenheid: 'min', rood: true };
      if (ms < 60000) {
        const sec = Math.ceil(ms / 1000);
        return { getal: sec, eenheid: 'sec', rood: vertraagd };
      }
      const min = Math.floor(ms / 60000);
      return { getal: min, eenheid: 'min', rood: vertraagd };
    }

    function tekenLadende() {
      const lijst = document.getElementById('lijst');
      lijst.innerHTML = Array(MAX_ROWS).fill(0).map(() => `
        <div class="row">
          <div class="cell-dir"><div class="dir-naam">Bezig met laden…</div></div>
          <div class="laden-punt"></div>
        </div>`).join('');
    }

    /* ══ RENDER — statisch, geen flip-animatie ══
       Stijl leunt op het officiele NS-vertrekbord qua kleur en typografie,
       maar telt af zoals iedereen gewend is: minuten, en onder de minuut
       in seconden. Rijen die niet rijden krijgen een streep erdoor. */
    function render(list) {
      const lijst = document.getElementById('lijst');

      if (!list || !list.length) {
        lijst.innerHTML = `<div class="row"><div class="cell-dir"><div class="dir-naam">Geen vertrektijden beschikbaar</div></div></div>`;
        return;
      }

      const rows = list.slice(0, MAX_ROWS);

      lijst.innerHTML = rows.map(dep => {
        const can = !!dep.cancelled;
        const dir = dep.direction || '–';
        const del = delayMin(dep.plannedDateTime, dep.actualDateTime);
        const trk = String(dep.actualTrack || dep.plannedTrack || '–').toUpperCase();
        const vertrekIso = dep.actualDateTime || dep.plannedDateTime || '';

        const statusHtml = can
          ? `<div class="dir-status rijdt-niet">Rijdt niet</div>`
          : (del >= 1 ? `<div class="dir-status">${del} min later</div>` : '');

        return `
          <div class="row ${can ? 'x' : ''}" data-vertrek="${vertrekIso}" data-vertraagd="${del >= 1 ? '1' : '0'}" data-geannuleerd="${can ? '1' : '0'}">
            <div class="cell-dir">
              <div class="dir-naam-wrap"><div class="dir-naam${can ? ' geannuleerd' : ''}">${dir}</div></div>
              ${statusHtml}
            </div>
            <div class="cell-spoor"><span class="spoor-chip">${trk}</span></div>
            <div class="cell-tijd"><span class="tijd-nu">–</span><span class="tijd-unit"></span></div>
          </div>`;
      }).join('');

      requestAnimationFrame(zetScrollAan);
      planScrollCheck();
      tickKlok();
    }

    // Meet pas als het lettertype echt geladen is (anders wordt de tekst te
    // smal ingeschat en start de scroll niet) — met een extra vangnet erna.
    function planScrollCheck() {
      const opnieuw = () => requestAnimationFrame(() => requestAnimationFrame(zetScrollAan));
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(opnieuw).catch(opnieuw);
      } else {
        opnieuw();
      }
      setTimeout(zetScrollAan, 500);
    }

    // Elke seconde de "over"-kolom bijwerken zonder de rest opnieuw te
    // tekenen — anders begint de scroll-animatie van lange plaatsnamen
    // steeds opnieuw.
    function tickKlok() {
      document.querySelectorAll('.row[data-vertrek]').forEach(row => {
        const cijfer = row.querySelector('.tijd-nu');
        const eenheid = row.querySelector('.tijd-unit');
        const geannuleerd = row.dataset.geannuleerd === '1';

        if (geannuleerd) {
          cijfer.textContent = '–';
          cijfer.className = 'tijd-nu geannuleerd';
          eenheid.textContent = '';
          return;
        }

        const ms = resterendMs(row.dataset.vertrek);
        const vertraagd = row.dataset.vertraagd === '1';
        const { getal, eenheid: eh, rood } = tijdWeergave(ms, vertraagd);

        cijfer.textContent = getal;
        cijfer.className = 'tijd-nu' + (rood ? ' vertraagd' : '');
        eenheid.textContent = eh;
      });
    }

    function zetScrollAan() {
      // Eerder toegevoegde keyframe-regels opruimen voordat we nieuwe maken.
      document.querySelectorAll('style[data-marquee-style]').forEach(s => s.remove());

      document.querySelectorAll('.dir-naam-wrap').forEach((wrap, i) => {
        const naam = wrap.querySelector('.dir-naam');
        naam.classList.remove('scrolt');
        naam.style.animation = 'none';

        const wrapBreedte = wrap.clientWidth;
        const tekstBreedte = naam.scrollWidth;
        if (tekstBreedte - wrapBreedte > 4) {
          const pauzeSec  = 5;                              // stilstaan met de A helemaal links
          const snelheid  = 55;                              // px per seconde tijdens het schuiven
          const reisSec   = Math.max(2, tekstBreedte / snelheid);
          const totaalSec = pauzeSec + reisSec;
          const pausePct  = (pauzeSec / totaalSec * 100).toFixed(2);

          const keyframeNaam = `marquee-${i}`;
          const styleEl = document.createElement('style');
          styleEl.setAttribute('data-marquee-style', '1');
          styleEl.textContent = `
            @keyframes ${keyframeNaam} {
              0%, ${pausePct}% { transform: translateX(0); }
              100% { transform: translateX(-${tekstBreedte}px); }
            }`;
          document.head.appendChild(styleEl);

          naam.style.animation = `${keyframeNaam} ${totaalSec}s linear infinite`;
          naam.classList.add('scrolt');
        }
      });
    }

    /* ══ NS API ══ */
    async function fetchDepartures() {
      if (!NS_API_KEY) {
        setStatus('Geen NS API-sleutel ingesteld — via ?nsapikey=... of in de code', 'fout');
        return;
      }
      const hdrs = { 'Ocp-Apim-Subscription-Key': NS_API_KEY };
      const url  = `https://gateway.apiportal.ns.nl/reisinformatie-api/api/v2/departures?station=${STATION_CODE}&maxJourneys=${MAX_ROWS}`;

      let deps = null;
      try {
        const r = await fetch(url, { headers: hdrs });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        deps = j.payload?.departures || j.departures || [];
      } catch (e) {
        setStatus('Fout bij ophalen: ' + e.message, 'fout');
        return;
      }

      render(deps);
      const n = new Date();
      setStatus(`Laatste update: ${pad(n.getHours())}:${pad(n.getMinutes())}`, 'ok');
    }

    /* ══ OPSTART ══ */
    window.addEventListener('DOMContentLoaded', () => {
      tekenLadende();
      setStatus('Vertrektijden ophalen…', 'bezig');
      setTimeout(() => {
        fetchDepartures();
        setInterval(fetchDepartures, REFRESH_MS);
        setInterval(tickKlok, 1000);
      }, 300);
    });
  </script>

</body>
</html>
