<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vertrektijden – Halfweg-Zwanenburg</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --rood:       #E4032D;
      --donkerrood: #A0021F;
      --zwart:      #1D1D1B;
      --grijs-m:    #616160;
      --grijs-l:    #D9D9D9;
      --wit:        #FFFFFF;
      --ns-geel:    #FFC917;
      --ns-blauw:   #003082;
      --fs-time:    62px;
      --fs-dir:     34px;
      --fs-via:     17px;
      --fs-badge:   16px;
      --fs-track:   46px;
      --fs-status:  17px;
      --row-pad:    22px 0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100vh;
      background: var(--zwart);
      font-family: 'Montserrat', Arial, sans-serif;
      color: var(--wit); overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(228,3,45,.10) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: fixed; top: 0; left: 0;
      width: 5px; height: 100%;
      background: linear-gradient(to bottom, var(--rood), var(--donkerrood));
      z-index: 10;
    }
    .screen {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; padding-left: 5px;
    }

    /* ── HEADER ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 48px 20px; flex-shrink: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, transparent 100%);
    }
    .header-left { display: flex; align-items: center; gap: 28px; }
    .logo-svg { height: 48px; width: auto; }
    .divider-v { width: 1px; height: 42px; background: rgba(255,255,255,.18); }
    .station-label { font-size: 11px; font-weight: 600; letter-spacing: 3.5px; text-transform: uppercase; color: var(--rood); margin-bottom: 4px; }
    .station-name { font-size: 34px; font-weight: 700; color: var(--wit); letter-spacing: .3px; }
    .header-right { text-align: right; }
    .clock { font-size: 82px; font-weight: 900; color: var(--wit); letter-spacing: 3px; line-height: 1; font-variant-numeric: tabular-nums; }
    .clock-sep { animation: blink 1s step-end infinite; color: var(--rood); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
    .date-str { font-size: 13px; font-weight: 400; color: var(--grijs-m); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 5px; }

    /* ── RODE LIJN MET TREIN ── */
    .red-line-wrap {
      position: relative;
      height: 2px;          /* alleen de lijn zelf */
      flex-shrink: 0;
      margin: 0 48px;
      overflow: visible;    /* trein mag boven/onder uitsteken */
      background: linear-gradient(90deg, var(--rood) 0%, var(--donkerrood) 55%, transparent 100%);
    }

    .train-anim {
      position: absolute;
      /* Wielen (onderkant SVG) op de rode lijn: bottom:0 = lijn-niveau */
      bottom: 0px;
      left: -340px;
      animation: treinRijdt 12s linear infinite;
      animation-delay: 0.5s;
      pointer-events: none;
      /* subtiele gele gloed */
      filter: drop-shadow(0 -2px 6px rgba(255,201,23,.35));
    }
    @keyframes treinRijdt {
      0%   { left: -560px; opacity: 0; }
      3%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { left: calc(100% + 80px); opacity: 0; }
    }
    .train-anim svg { width: 400px; height: auto; display: block; }

    /* ── KOLOM HEADERS ── */
    .col-head {
      display: grid;
      grid-template-columns: 180px 1fr 280px 120px 180px;
      padding: 12px 48px 10px; flex-shrink: 0;
    }
    .col-head span { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--grijs-m); }
    .col-head span.c { text-align: center; }
    .col-head span.r { text-align: right; }
    .thin-line { height: 1px; flex-shrink: 0; margin: 0 48px; background: rgba(255,255,255,.08); }

    /* ── DEPARTURES ── */
    .departures { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0 48px; }
    .row {
      display: grid; grid-template-columns: 180px 1fr 280px 120px 180px;
      align-items: center; padding: var(--row-pad);
      border-bottom: 1px solid rgba(255,255,255,.07);
      animation: enter .3s ease both; opacity: 0; position: relative;
    }
    .row:first-child::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(228,3,45,.07) 0%, transparent 50%); pointer-events: none; }
    .row:nth-child(even) { background: rgba(255,255,255,.02); }
    @keyframes enter { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
    .row:nth-child(1){animation-delay:.03s}.row:nth-child(2){animation-delay:.06s}.row:nth-child(3){animation-delay:.09s}
    .row:nth-child(4){animation-delay:.12s}.row:nth-child(5){animation-delay:.15s}.row:nth-child(6){animation-delay:.18s}
    .row:nth-child(7){animation-delay:.21s}.row:nth-child(8){animation-delay:.24s}.row:nth-child(9){animation-delay:.27s}

    .cell-time { display: flex; flex-direction: column; gap: 2px; }
    .time-planned { font-size: var(--fs-time); font-weight: 700; color: var(--wit); letter-spacing: 1px; line-height: 1; font-variant-numeric: tabular-nums; }
    .time-planned.struck { font-size: 22px; font-weight: 400; color: var(--grijs-m); text-decoration: line-through; }
    .time-actual { font-size: 56px; font-weight: 700; color: var(--rood); letter-spacing: 1px; font-variant-numeric: tabular-nums; line-height: 1; }
    .cell-dir { padding-left: 32px; padding-right: 20px; }
    .dir-name { font-size: var(--fs-dir); font-weight: 700; color: var(--wit); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
    .dir-via { font-size: var(--fs-via); font-weight: 400; color: var(--grijs-m); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell-train { display: flex; flex-direction: row; align-items: center; gap: 16px; }
    .train-top { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .badge { font-size: var(--fs-badge); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 6px 13px; border-radius: 3px; }
    .badge-ic  { background: rgba(255,255,255,.1); color: var(--wit);     border: 1px solid rgba(255,255,255,.2); }
    .badge-spr { background: rgba(228,3,45,.10);   color: rgba(228,3,45,0.75);    border: 1px solid rgba(228,3,45,.3); }
    .badge-int { background: rgba(228,3,45,.3);     color: var(--wit);     border: 1px solid var(--rood); }
    .badge-x   { background: rgba(255,255,255,.06); color: var(--grijs-l); border: 1px solid rgba(255,255,255,.12); }
    .crowd { display: flex; align-items: center; gap: 9px; }
    .crowd-none .crowd-icon { color: rgba(255,255,255,.15); }
    .crowd-low  .crowd-icon { color: rgba(255,255,255,.4); }
    .crowd-med  .crowd-icon { color: rgba(230,170,0,.95); }
    .crowd-high .crowd-icon { color: var(--rood); }
    .crowd-bars { display: flex; align-items: flex-end; gap: 3px; }
    .crowd-bars b { display: block; width: 5px; border-radius: 2px; background: rgba(255,255,255,.12); }
    .crowd-bars b:nth-child(1){height:7px}.crowd-bars b:nth-child(2){height:12px}.crowd-bars b:nth-child(3){height:17px}
    .crowd-low  .crowd-bars b:nth-child(1)                { background: rgba(255,255,255,.45); }
    .crowd-med  .crowd-bars b:nth-child(1),
    .crowd-med  .crowd-bars b:nth-child(2)                { background: rgba(230,170,0,.9); }
    .crowd-high .crowd-bars b                             { background: var(--rood); }
    .crowd-text { font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .crowd-none .crowd-text { color: rgba(255,255,255,.15); }
    .crowd-low  .crowd-text { color: rgba(255,255,255,.35); }
    .crowd-med  .crowd-text { color: rgba(230,170,0,.9); }
    .crowd-high .crowd-text { color: var(--rood); }
    .cell-track { text-align: center; }
    .track-num { font-size: var(--fs-track); font-weight: 700; color: var(--wit); line-height: 1; }
    .track-lbl { font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--grijs-m); margin-top: 3px; }
    .cell-status { text-align: right; }
    .status { display: inline-block; font-size: var(--fs-status); font-weight: 600; letter-spacing: .5px; padding: 6px 14px; border-radius: 3px; }
    .s-ok     { background: rgba(34,160,80,.12); color: rgba(76,206,130,0.75); border: 1px solid rgba(34,160,80,.22); }
    .s-late   { background: rgba(228,3,45,.12);  color: rgba(228,3,45,0.80); border: 1px solid rgba(228,3,45,.3); }
    .s-cancel { background: var(--rood); color: var(--wit); }
    .msg-line { font-size: 12px; font-weight: 500; color: rgba(228,3,45,.8); margin-top: 5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: var(--grijs-m); }
    .spinner { width: 44px; height: 44px; border: 3px solid rgba(255,255,255,.08); border-top-color: var(--rood); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .empty-lbl { font-size: 16px; letter-spacing: 1px; }
    .err { display: none; flex-shrink: 0; padding: 10px 48px; background: rgba(228,3,45,.1); border-left: 3px solid var(--rood); font-size: 13px; font-weight: 500; color: var(--rood); letter-spacing: .3px; }
    .footer-line { height: 1px; flex-shrink: 0; margin: 0 48px; background: rgba(255,255,255,.07); }
    .footer { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px 48px; background: linear-gradient(0deg, rgba(0,0,0,.3) 0%, transparent 100%); }
    .footer-brand { display: flex; align-items: center; gap: 10px; }
    .footer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rood); }
    .footer-name { font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--grijs-m); }
    .footer-upd { font-size: 11px; font-weight: 400; letter-spacing: 1px; color: rgba(255,255,255,.2); }
  </style>
</head>

    function tickClock(){
      const d=new Date();
      document.getElementById('hh').textContent=pad(d.getHours());
      document.getElementById('mm').textContent=pad(d.getMinutes());
      document.getElementById('ds').textContent=DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
    }
    setInterval(tickClock,1000);tickClock();

    function fmtTime(iso){if(!iso)return'--:--';const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());}
    function delayMin(p,a){if(!p||!a)return 0;return Math.round((new Date(a)-new Date(p))/60000);}
    function badgeCls(cat){const c=(cat||'').toUpperCase();if(c==='IC'||c==='ICD')return'badge-ic';if(c==='SPR')return'badge-spr';if(['INT','ICE','THA','EUR'].includes(c))return'badge-int';return'badge-x';}
    function crowdCls(cf){const c=(cf||'').toUpperCase();if(c==='HIGH')return'crowd-high';if(c==='MEDIUM')return'crowd-med';if(c==='LOW')return'crowd-low';return'';}
    function crowdLbl(cf){const c=(cf||'').toUpperCase();if(c==='HIGH')return'Vol';if(c==='MEDIUM')return'Druk';if(c==='LOW')return'Rustig';return'';}

    function render(list){
      const el=document.getElementById('deps');
      if(!list||!list.length){el.innerHTML='<div class="empty"><div class="empty-lbl">Geen vertrektijden beschikbaar</div></div>';return;}
      el.innerHTML=list.slice(0,MAX_ROWS).map(dep=>{
        const pt=fmtTime(dep.plannedDateTime),at=fmtTime(dep.actualDateTime);
        const del=delayMin(dep.plannedDateTime,dep.actualDateTime),can=!!dep.cancelled;
        const cat=dep.trainCategory||'?',dir=dep.direction||'–';
        const via=(dep.routeStations||[]).slice(0,4).map(s=>s.mediumName).join(' · ');
        const trk=dep.actualTrack||dep.plannedTrack||'–';
        const msg=dep.messages&&dep.messages.length?dep.messages[0].text||'':'';
        const timeHtml=can?`<div class="time-planned struck">${pt}</div>`:del>=1?`<div class="time-planned struck">${pt}</div><div class="time-actual">${at}</div>`:`<div class="time-planned">${pt}</div>`;
        const cf=dep.crowdForecast||'',cc=crowdCls(cf),cl=crowdLbl(cf);
        const personSvg=`<svg class="crowd-icon" width="18" height="22" viewBox="0 0 18 22" fill="currentColor"><circle cx="9" cy="5" r="4"/><path d="M1 21c0-4.4 3.6-8 8-8s8 3.6 8 8H1z"/></svg>`;
        const crowdHtml=`<div class="crowd ${cc||'crowd-none'}">${personSvg}<div class="crowd-bars"><b></b><b></b><b></b></div><span class="crowd-text">${cl||'–'}</span></div>`;
        const statusHtml=can?`<span class="status s-cancel">Rijdt niet</span>`:del>=1?`<span class="status s-late">+${del} min</span>`:`<span class="status s-ok">0 min</span>`;
        const msgHtml=msg?`<div class="msg-line">⚠ ${msg}</div>`:'';
        return`<div class="row">
          <div class="cell-time">${timeHtml}</div>
          <div class="cell-dir"><div class="dir-name">${dir}</div>${via?`<div class="dir-via">via ${via}</div>`:''}${msgHtml}</div>
          <div class="cell-train"><div class="train-top"><span class="badge ${badgeCls(cat)}">${cat}</span></div>${crowdHtml}</div>
          <div class="cell-track"><div class="track-num">${trk}</div><div class="track-lbl">spoor</div></div>
          <div class="cell-status">${statusHtml}</div>
        </div>`;
      }).join('');
    }

    function fetchCrowd(dep){
      // NS levert geen drukte-data voor Halfweg-Zwanenburg.
      // Schatting op basis van vertrektijd + richting.
      const dt = new Date(dep.plannedDateTime);
      const h  = dt.getHours();
      const min = dt.getMinutes();
      const mins = h * 60 + min;
      const dir = (dep.direction || '').toLowerCase();
      const naarAms = dir.includes('amsterdam') || dir.includes('sloterdijk');

      // Ochtendspits richting Amsterdam (07:00-09:30)
      if(naarAms && mins >= 420 && mins <= 570) return 'HIGH';
      // Avondspits weg van Amsterdam (16:00-19:00)
      if(!naarAms && mins >= 960 && mins <= 1140) return 'HIGH';
      // Omgekeerd medium
      if(mins >= 390 && mins <= 600) return 'MEDIUM';
      if(mins >= 940 && mins <= 1160) return 'MEDIUM';
      // Dal
      return 'LOW';
    }

    async function fetchDepartures(){
      const errEl=document.getElementById('err');
      const hdrs={'Ocp-Apim-Subscription-Key':NS_API_KEY};
      let deps=null;
      try{const r=await fetch(`https://gateway.apiportal.ns.nl/timetable-api/v2/departures?station=${STATION_CODE}&maxJourneys=${MAX_ROWS}`,{headers:hdrs});if(r.ok){const j=await r.json();deps=j.payload?.departures||j.departures||[];}}catch(e){}
      if(!deps){
        try{const r=await fetch(`https://gateway.apiportal.ns.nl/reisinformatie-api/api/v2/departures?station=${STATION_CODE}&maxJourneys=${MAX_ROWS}`,{headers:hdrs});if(r.ok){const j=await r.json();deps=j.payload?.departures||j.departures||[];}else{throw new Error('HTTP '+r.status);}}
        catch(e){errEl.style.display='block';errEl.textContent='⚠  '+e.message;document.getElementById('upd').textContent='Fout';return;}
      }
      errEl.style.display='none';
      render(deps);
      try{
        const slice=deps.slice(0,MAX_ROWS);
        const crowds=slice.map(d=>fetchCrowd(d));
        render(slice.map((d,i)=>({...d,crowdForecast:crowds[i]||''})));
      }catch(e){}
      const n=new Date();
      document.getElementById('upd').textContent='Bijgewerkt om '+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
    }
    fetchDepartures();
    setInterval(fetchDepartures,REFRESH_MS);
  </script>
</body>
