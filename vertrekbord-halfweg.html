<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vertrektijden – Halfweg-Zwanenburg</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>

    /* ═══════════════════════════════════════
       AMSTELLAND INGENIEURS — KLEURPALET
    ════════════════════════════════════════ */
    :root {
      --rood:        #E4032D;
      --donkerrood:  #A0021F;
      --zwart:       #1D1D1B;
      --grijs-donker:#484848;
      --grijs-midden:#616160;
      --grijs-licht: #D9D9D9;
      --gebroken-wit:#F5F5F5;
      --wit:         #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100vh;
      background: var(--zwart);
      font-family: 'Montserrat', 'Arial Narrow', Arial, sans-serif;
      color: var(--wit);
      overflow: hidden;
    }

    /* ═══════════════════════════════════════
       ACHTERGROND — subtiele textuur
    ════════════════════════════════════════ */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(228,3,45,.08) 0%, transparent 70%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 79px,
          rgba(255,255,255,.025) 79px,
          rgba(255,255,255,.025) 80px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* Subtiele rode verticale streep — verwijzing naar logo */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: linear-gradient(to bottom, var(--rood), var(--donkerrood));
      z-index: 10;
    }

    /* ═══════════════════════════════════════
       LAYOUT WRAPPER
    ════════════════════════════════════════ */
    .screen {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0 0 0 4px; /* ruimte voor rode streep */
    }

    /* ═══════════════════════════════════════
       HEADER
    ════════════════════════════════════════ */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 36px 18px 36px;
      background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, transparent 100%);
      flex-shrink: 0;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo-svg {
      height: 42px;
      width: auto;
      /* Maak de donkerdere elementen wit zodat het leesbaar is op donker */
      filter: brightness(0) invert(1);
    }

    /* Rode override voor het rode element in het logo */
    .logo-svg .cls-2-override {
      fill: var(--rood) !important;
    }

    .header-divider {
      width: 1px;
      height: 36px;
      background: rgba(255,255,255,.2);
    }

    .station-block {}

    .station-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--rood);
      margin-bottom: 3px;
    }

    .station-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--wit);
      letter-spacing: .5px;
    }

    /* Klok rechts */
    .header-right {
      text-align: right;
    }

    .clock {
      font-size: 52px;
      font-weight: 900;
      color: var(--wit);
      letter-spacing: 2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .clock-colon {
      animation: blink 1s step-end infinite;
      color: var(--rood);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: .2; }
    }

    .date-line {
      font-size: 12px;
      font-weight: 400;
      color: var(--grijs-midden);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ═══════════════════════════════════════
       RODE SCHEIDINGSLIJN
    ════════════════════════════════════════ */
    .red-rule {
      height: 2px;
      background: linear-gradient(90deg, var(--rood) 0%, var(--donkerrood) 60%, transparent 100%);
      flex-shrink: 0;
      margin: 0 36px;
    }

    /* ═══════════════════════════════════════
       KOLOM-HEADERS
    ════════════════════════════════════════ */
    .col-headers {
      display: grid;
      grid-template-columns: 100px 1fr 180px 90px 100px;
      padding: 10px 36px;
      flex-shrink: 0;
    }

    .col-headers span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--grijs-midden);
    }

    .col-headers span.center { text-align: center; }
    .col-headers span.right  { text-align: right; }

    /* ═══════════════════════════════════════
       DUNNE SCHEIDINGSLIJN
    ════════════════════════════════════════ */
    .thin-rule {
      height: 1px;
      background: rgba(255,255,255,.07);
      flex-shrink: 0;
      margin: 0 36px;
    }

    /* ═══════════════════════════════════════
       VERTREKTIJDEN LIJST
    ════════════════════════════════════════ */
    .departures {
      flex: 1;
      overflow: hidden;
      padding: 0 36px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .departure-row {
      display: grid;
      grid-template-columns: 100px 1fr 180px 90px 100px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      animation: slideIn .35s ease forwards;
      opacity: 0;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Staggered animaties */
    .departure-row:nth-child(1)  { animation-delay: .04s; }
    .departure-row:nth-child(2)  { animation-delay: .08s; }
    .departure-row:nth-child(3)  { animation-delay: .12s; }
    .departure-row:nth-child(4)  { animation-delay: .16s; }
    .departure-row:nth-child(5)  { animation-delay: .20s; }
    .departure-row:nth-child(6)  { animation-delay: .24s; }
    .departure-row:nth-child(7)  { animation-delay: .28s; }
    .departure-row:nth-child(8)  { animation-delay: .32s; }
    .departure-row:nth-child(9)  { animation-delay: .36s; }
    .departure-row:nth-child(10) { animation-delay: .40s; }

    /* Eerste rij: iets meer accent */
    .departure-row:first-child {
      background: linear-gradient(90deg, rgba(228,3,45,.06) 0%, transparent 60%);
    }

    /* TIJD */
    .dep-time-block {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .dep-time {
      font-size: 28px;
      font-weight: 700;
      color: var(--wit);
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .dep-time.is-delayed {
      font-size: 16px;
      font-weight: 400;
      color: var(--grijs-midden);
      text-decoration: line-through;
    }

    .dep-time-actual {
      font-size: 26px;
      font-weight: 700;
      color: var(--rood);
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* RICHTING */
    .dep-direction-block {
      padding-right: 16px;
    }

    .dep-direction {
      font-size: 20px;
      font-weight: 600;
      color: var(--wit);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dep-via {
      font-size: 11px;
      font-weight: 400;
      color: var(--grijs-midden);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* TREIN TYPE */
    .dep-type-block {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .train-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 8px;
      border-radius: 2px;
      text-transform: uppercase;
    }

    .badge-ic   { background: rgba(255,255,255,.1);  color: var(--wit);          border: 1px solid rgba(255,255,255,.2); }
    .badge-spr  { background: rgba(228,3,45,.15);    color: var(--rood);         border: 1px solid rgba(228,3,45,.4);    }
    .badge-int  { background: rgba(228,3,45,.25);    color: var(--wit);          border: 1px solid var(--rood);          }
    .badge-other{ background: rgba(255,255,255,.06); color: var(--grijs-licht);  border: 1px solid rgba(255,255,255,.1); }

    .delay-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 10px;
      background: var(--rood);
      color: var(--wit);
      letter-spacing: .5px;
    }

    /* SPOOR */
    .dep-track {
      text-align: center;
    }

    .track-number {
      font-size: 26px;
      font-weight: 700;
      color: var(--wit);
    }

    .track-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--grijs-midden);
      margin-top: 1px;
    }

    /* STATUS */
    .dep-status {
      text-align: right;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      padding: 5px 10px;
      border-radius: 2px;
    }

    .status-ontime    { color: rgba(255,255,255,.35); }
    .status-delayed   { color: var(--rood); }
    .status-cancelled {
      background: var(--rood);
      color: var(--wit);
      padding: 4px 8px;
      border-radius: 2px;
    }

    /* ═══════════════════════════════════════
       LEGE STAAT / LADEN
    ════════════════════════════════════════ */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--grijs-midden);
    }

    .spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: var(--rood);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-label {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    /* ═══════════════════════════════════════
       ERROR BANNER
    ════════════════════════════════════════ */
    .error-banner {
      flex-shrink: 0;
      display: none;
      background: rgba(228,3,45,.12);
      border-left: 3px solid var(--rood);
      padding: 10px 36px;
      font-size: 12px;
      font-weight: 500;
      color: var(--rood);
      letter-spacing: .3px;
    }

    /* ═══════════════════════════════════════
       FOOTER
    ════════════════════════════════════════ */
    .footer-rule {
      height: 1px;
      background: rgba(255,255,255,.07);
      margin: 0 36px;
      flex-shrink: 0;
    }

    .footer {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 36px;
      background: linear-gradient(0deg, rgba(0,0,0,.3) 0%, transparent 100%);
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--rood);
    }

    .footer-text {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--grijs-midden);
    }

    .footer-refresh {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 1px;
      color: rgba(255,255,255,.2);
    }

    /* ═══════════════════════════════════════
       NS LINK (subtiel rechtsonder)
    ════════════════════════════════════════ */
    .ns-link {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 1px;
      color: rgba(255,255,255,.2);
      text-decoration: none;
    }

    .ns-link:hover { color: var(--rood); }

  </style>
</head>

      <div class="header-right">
        <div class="clock">

    <!-- RODE LIJN -->
    <div class="red-rule"></div>

    <!-- KOLOM HEADERS -->
    <div class="col-headers">
      <span>Vertrek</span>
      <span>Richting</span>
      <span>Trein</span>
      <span class="center">Spoor</span>
      <span class="right">Status</span>
    </div>

    <div class="thin-rule"></div>

    <!-- ERROR BANNER -->
    <div class="error-banner" id="error-banner"></div>

    <!-- VERTREKTIJDEN -->
    <div class="departures" id="departures">
      <div class="empty-state" id="loading">
        <div class="spinner"></div>
        <div class="empty-label">Vertrektijden ophalen…</div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-rule"></div>
    <footer class="footer">
      <div class="footer-left">
        <div class="footer-dot"></div>
        <span class="footer-text">Amstelland Ingenieurs</span>
      </div>
      <a class="ns-link" href="https://www.ns.nl/reisplanner/#/?vertrek=Halfweg-Zwanenburg" target="_blank">ns.nl →</a>
      <span class="footer-refresh" id="refresh-label">–</span>
    </footer>

  </div><!-- .screen -->

  <script>
    /* ─────────────────────────────────────────
       KLOK
    ───────────────────────────────────────── */
    const DAYS   = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
    const MONTHS = ['januari','februari','maart','april','mei','juni',
                    'juli','augustus','september','oktober','november','december'];

    function pad(n){ return String(n).padStart(2,'0'); }

    function updateClock(){
      const now = new Date();
      document.getElementById('clock-h').textContent = pad(now.getHours());
      document.getElementById('clock-m').textContent = pad(now.getMinutes());
      document.getElementById('date-line').textContent =
        DAYS[now.getDay()] + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ─────────────────────────────────────────
       HELPERS
    ───────────────────────────────────────── */
    function fmtTime(iso){
      if(!iso) return '--:--';
      const d = new Date(iso);
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function delayMin(planned, actual){
      if(!planned || !actual) return 0;
      return Math.round((new Date(actual) - new Date(planned)) / 60000);
    }

    function badgeCls(cat){
      if(!cat) return 'badge-other';
      const c = cat.toUpperCase();
      if(c==='IC'||c==='ICD') return 'badge-ic';
      if(c==='SPR')           return 'badge-spr';
      if(['INT','ICE','THA','EUR'].includes(c)) return 'badge-int';
      return 'badge-other';
    }

    /* ─────────────────────────────────────────
       RENDER
    ───────────────────────────────────────── */
    function render(list){
      const el = document.getElementById('departures');

      if(!list || list.length === 0){
        el.innerHTML = `<div class="empty-state"><div class="empty-label">Geen vertrektijden beschikbaar</div></div>`;
        return;
      }

      const rows = list.slice(0, MAX_ROWS).map(dep => {
        const pt  = fmtTime(dep.plannedDateTime);
        const at  = fmtTime(dep.actualDateTime);
        const del = delayMin(dep.plannedDateTime, dep.actualDateTime);
        const cancelled = !!dep.cancelled;
        const cat = dep.trainCategory || '?';
        const dir = dep.direction || '–';
        const via = (dep.routeStations||[]).slice(0,4).map(s=>s.mediumName).join(' · ');
        const track = dep.actualTrack || dep.plannedTrack || '–';

        /* Tijd blok */
        let timeHtml;
        if(cancelled){
          timeHtml = `<div class="dep-time is-delayed">${pt}</div>`;
        } else if(del >= 1){
          timeHtml = `<div class="dep-time is-delayed">${pt}</div><div class="dep-time-actual">${at}</div>`;
        } else {
          timeHtml = `<div class="dep-time">${pt}</div>`;
        }

        /* Delay pill */
        const pill = (!cancelled && del >= 1) ? `<span class="delay-pill">+${del} min</span>` : '';

        /* Status */
        let statusHtml;
        if(cancelled){
          statusHtml = `<span class="status-badge status-cancelled">Rijdt niet</span>`;
        } else if(del >= 1){
          statusHtml = `<span class="status-badge status-delayed">${del} min later</span>`;
        } else {
          statusHtml = `<span class="status-badge status-ontime">Op tijd</span>`;
        }

        return `
          <div class="departure-row">
            <div class="dep-time-block">${timeHtml}</div>
            <div class="dep-direction-block">
              <div class="dep-direction">${dir}</div>
              ${via ? `<div class="dep-via">via ${via}</div>` : ''}
            </div>
            <div class="dep-type-block">
              <span class="train-badge ${badgeCls(cat)}">${cat}</span>${pill}
            </div>
            <div class="dep-track">
              <div class="track-number">${track}</div>
              <div class="track-label">spoor</div>
            </div>
            <div class="dep-status">${statusHtml}</div>
          </div>`;
      });

      el.innerHTML = rows.join('');
    }

    /* ─────────────────────────────────────────
       NS API
    ───────────────────────────────────────── */
    async function fetchDepartures(){
      const errEl = document.getElementById('error-banner');

      if(!NS_API_KEY || NS_API_KEY === 'JOUW_NS_API_SLEUTEL_HIER'){
        errEl.style.display = 'block';
        errEl.textContent = '⚠  Vul je NS API-sleutel in bovenaan het HTML-bestand — zie apiportal.ns.nl';
        document.getElementById('departures').innerHTML =
          `<div class="empty-state"><div class="empty-label">API-sleutel ontbreekt</div></div>`;
        return;
      }

      try {

      // Probeer eerst de nieuwe timetable-api, dan de oude als fallback
      const ENDPOINTS = [
        `https://gateway.apiportal.ns.nl/timetable-api/v2/departures?station=${STATION_CODE}&maxJourneys=${MAX_ROWS}`,
        `https://gateway.apiportal.ns.nl/reisinformatie-api/api/v2/departures?station=${STATION_CODE}&maxJourneys=${MAX_ROWS}`
      ];

      let lastError = null;

      for(const url of ENDPOINTS){
        try{
          const resp = await fetch(url, {
            headers:{ 'Ocp-Apim-Subscription-Key': NS_API_KEY }
          });

          if(resp.status === 401) throw new Error('HTTP 401 — API-sleutel ongeldig of verlopen');
          if(resp.status === 403) throw new Error('HTTP 403 — Geen toegang. Controleer "NS App" subscriptie op apiportal.ns.nl');
          if(resp.status === 404){ lastError = new Error(`HTTP 404 via ${url}`); continue; }
          if(!resp.ok) throw new Error(`HTTP ${resp.status}`);

          const json = await resp.json();
          const deps = (json.payload && json.payload.departures) || [];

          errEl.style.display = 'none';
          render(deps);

          const now = new Date();
          document.getElementById('refresh-label').textContent =
            'Bijgewerkt om ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
          return; // succes — stop hier

        } catch(err){
          // 401/403 direct gooien, 404 proberen we de volgende endpoint
          if(err.message.startsWith('HTTP 401') || err.message.startsWith('HTTP 403')) throw err;
          lastError = err;
        }
      }

      // Beide endpoints gefaald
      throw lastError || new Error('Alle endpoints gaven een fout');

      } catch(err) {
        errEl.style.display = 'block';
        errEl.textContent = '⚠  ' + err.message;
        document.getElementById('refresh-label').textContent = 'Poging mislukt';
      }
    }

    fetchDepartures();
    setInterval(fetchDepartures, REFRESH_MS);
  </script>
