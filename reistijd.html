<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>Reistijd naar Huis — Amstelland Ingenieurs</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: #1D1D1B;
      color: #1D1D1B;
    }

    /* ══ SCHERM ══════════════════════════════════════════════════════ */
    .scherm { display: flex; flex-direction: column; width: 1920px; height: 1080px; }

    /* ══ HEADER ══════════════════════════════════════════════════════ */
    header {
      height: 86px; flex-shrink: 0;
      background: #111110;
      border-bottom: 3px solid #E4032D;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 44px;
      position: relative;
    }
    header::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 7px; background: #E4032D;
    }

    .logo { display: flex; align-items: center; gap: 20px; padding-left: 8px; }
    .logo-bars { display: flex; flex-direction: column; gap: 5px; }
    .lb { border-radius: 2px; }
    .lb1 { width: 40px; height: 4px; background: #E4032D; }
    .lb2 { width: 28px; height: 4px; background: rgba(255,255,255,.2); }
    .lb3 { width: 34px; height: 4px; background: #E4032D; opacity: .45; }
    .logo-tekst h1 {
      font-size: 1.25rem; font-weight: 700;
      color: #fff; letter-spacing: .025em;
    }
    .logo-sub {
      font-size: .72rem; color: rgba(255,255,255,.35);
      font-weight: 300; margin-top: 3px;
      max-width: 640px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .header-rechts { display: flex; align-items: center; gap: 24px; }
    .inst-knop {
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.45); font-family: inherit;
      font-size: .7rem; padding: 7px 14px; border-radius: 5px; cursor: pointer;
      transition: all .15s;
    }
    .inst-knop:hover { background: rgba(255,255,255,.13); color: #fff; }
    .klok-blok { text-align: right; }
    .klok  { font-size: 2.4rem; font-weight: 800; color: #fff; line-height: 1; }
    .datum { font-size: .68rem; color: rgba(255,255,255,.35); font-weight: 300; margin-top: 4px; }

    /* ══ GRID ════════════════════════════════════════════════════════ */
    .grid-wrapper {
      flex: 1;
      padding: 18px 22px 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 13px;
      height: 100%;
    }

    /* ══ KAART ═══════════════════════════════════════════════════════ */
    .kaart {
      border-radius: 10px;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 28px rgba(0,0,0,.45);
      position: relative;
      background: #e8e6e3 center/cover no-repeat;
    }
    .kaart::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      z-index: 0;
    }
    .kaart-accent {
      height: 5px; background: #E4032D; flex-shrink: 0;
      position: relative; z-index: 1;
    }
    .kaart-body   {
      flex: 1; padding: 18px 20px 16px;
      display: flex; flex-direction: column;
      justify-content: space-between;
      position: relative; z-index: 1;
    }

    /* — Kop — */
    .kaart-kop {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 6px;
    }
    .plaatsnaam { font-size: 1.9rem; font-weight: 800; color: #1D1D1B; line-height: 1.1; text-shadow: 0 0 18px rgba(255,255,255,1), 0 0 8px rgba(255,255,255,1); }
    .regio      { font-size: .8rem; color: #333; font-weight: 600; margin-top: 3px; text-shadow: 0 0 10px rgba(255,255,255,1); }
    .pin-wrap {
      width: 34px; height: 34px; background: #F5F5F5; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* — Reistijd — */
    .rtijd-blok { display: flex; align-items: center; }
    .rtijd {
      font-size: 4.6rem; font-weight: 800; line-height: 1;
      letter-spacing: -.03em;
      text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 8px rgba(255,255,255,.8);
    }
    .rtijd.g { color: #1a7a2e; }
    .rtijd.o { color: #c45e00; }
    .rtijd.r { color: #E4032D; }
    .rtijd.gr { color: #bbb; font-size: 2.4rem; font-weight: 600; }

    /* — Onderste zone — */
    .kaart-onder { display: flex; flex-direction: column; gap: 6px; }

    /* Weg-chips */
    .wegen { display: flex; flex-wrap: wrap; gap: 4px; }
    .weg {
      font-size: .65rem; font-weight: 800;
      padding: 2px 7px; border-radius: 3px;
      letter-spacing: .04em;
    }
    .weg.A { background: #1b3a6b; color: #fff; }
    .weg.N { background: #e8a000; color: #1D1D1B; }
    .weg.R { background: #484848; color: #fff; }

    /* Route quick-guide */
    .route-tekst {
      font-size: 1.05rem; color: #1D1D1B; font-weight: 700;
      line-height: 1.45;
      background: rgba(255,255,255,.85);
      border-left: 4px solid #E4032D;
      border-radius: 4px;
      padding: 6px 10px;
    }

    /* Flitspaal badge */
    .flitspaal-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,.88);
      border: 1.5px solid #e8a000;
      border-radius: 4px;
      padding: 2px 7px;
      width: fit-content;
    }
    .flitspaal-badge.veel {
      border-color: #E4032D;
      background: rgba(255,232,232,.9);
    }
    .flitspaal-nr {
      font-size: .8rem; font-weight: 800; color: #1D1D1B;
      line-height: 1;
    }
    .flitspaal-label {
      font-size: .58rem; font-weight: 700; color: #444;
    }

    /* Flitsers */
    .flitser-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: .66rem; font-weight: 700;
      padding: 3px 9px; border-radius: 4px;
      background: #fff8e1; color: #7d5a00;
      border: 1px solid #ffd54f;
      width: fit-content;
    }
    .flitser-badge.veel { background: #fde8ea; color: #a0021f; border-color: #f5b8c0; }

    /* Vertraging */
    .vertraging {
      font-size: .73rem; font-weight: 600;
      display: flex; align-items: center; gap: 5px;
    }
    .vertraging.o { color: #c45e00; }
    .vertraging.r { color: #E4032D; }

    /* Meta */
    .rmeta {
      font-size: .82rem; color: #1D1D1B; font-weight: 600;
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
      background: rgba(255,255,255,.82);
      border-radius: 5px;
      padding: 5px 9px;
    }
    .badge {
      font-size: .7rem; font-weight: 800; padding: 2px 8px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: .04em;
    }
    .badge.g { background: #1a7a2e; color: #fff; }
    .badge.o { background: #c45e00; color: #fff; }
    .badge.r { background: #E4032D; color: #fff; }

    /* Voortgangsbalk */
    .voortgangsbalk {
      height: 4px; background: #EFEFEF; border-radius: 2px; overflow: hidden;
      margin-top: 3px;
    }
    .voortgang { height: 100%; border-radius: 2px; transition: width 1s ease; }
    .voortgang.g { background: #1a7a2e; }
    .voortgang.o { background: #c45e00; }
    .voortgang.r { background: #E4032D; }

    /* Laden */
    .laden-rij {
      display: flex; align-items: center; gap: 10px;
      color: #ccc; font-size: .85rem; font-weight: 300;
    }
    .spinner {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 2.5px solid #E8E8E8; border-top-color: #E4032D;
      border-radius: 50%; animation: draaien .7s linear infinite;
    }
    @keyframes draaien { to { transform: rotate(360deg); } }

    /* ══ STATUSBALK ═══════════════════════════════════════════════════ */
    .statusbar {
      height: 38px; flex-shrink: 0;
      background: #111110;
      border-top: 2px solid #E4032D;
      padding: 0 44px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .status-links { display: flex; align-items: center; gap: 9px; }
    .sdot { width: 7px; height: 7px; border-radius: 50%; background: #2e7d32; }
    .sdot.bezig { background: #c45e00; animation: knip 1s ease infinite; }
    .sdot.fout  { background: #E4032D; }
    @keyframes knip { 0%,100%{opacity:1} 50%{opacity:.2} }
    .stxt { font-size: .68rem; color: rgba(255,255,255,.35); font-weight: 300; }
    .merk { font-size: .62rem; color: rgba(255,255,255,.18); letter-spacing: .1em; text-transform: uppercase; }
    .merk em { color: #E4032D; font-style: normal; opacity: .8; }

    /* ══ SETUP OVERLAY ════════════════════════════════════════════════ */
    #setup-overlay {
      position: fixed; inset: 0;
      background: rgba(10,10,10,.9);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
    }
    .setup-kaart {
      background: #fff; border-radius: 12px;
      border-top: 5px solid #E4032D;
      padding: 44px; width: 540px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .setup-kaart h2 { font-size: 1.15rem; font-weight: 700; color: #1D1D1B; margin-bottom: 6px; }
    .setup-intro    { font-size: .85rem; color: #616160; font-weight: 300; margin-bottom: 30px; line-height: 1.6; }
    label {
      display: block; font-size: .68rem; font-weight: 700;
      color: #616160; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px;
    }
    input[type=text], input[type=password] {
      width: 100%; padding: 12px 15px;
      border: 1.5px solid #D9D9D9; border-radius: 6px;
      font-family: inherit; font-size: .9rem; color: #1D1D1B;
      outline: none; transition: border-color .2s; margin-bottom: 20px;
    }
    input:focus { border-color: #E4032D; }
    .hint { font-size: .73rem; color: #888; font-weight: 300; margin-top: -14px; margin-bottom: 20px; line-height: 1.5; }
    .hint a { color: #E4032D; text-decoration: none; }
    .knop-rood {
      width: 100%; padding: 14px;
      background: #E4032D; color: #fff; border: none; border-radius: 6px;
      font-family: inherit; font-size: .95rem; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    .knop-rood:hover { background: #A0021F; }
    .foutmelding {
      background: #fde8ea; border-left: 4px solid #E4032D;
      border-radius: 4px; padding: .75rem 1rem;
      font-size: .8rem; color: #A0021F; margin-top: .75rem;
      display: none; white-space: pre-wrap;
    }

    /* ══ MODAL INSTELLINGEN ═══════════════════════════════════════════ */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 10px; border-top: 5px solid #E4032D;
      padding: 38px; width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 24px; color: #1D1D1B; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
    .knop-wit {
      padding: 10px 20px; background: #fff; color: #1D1D1B;
      border: 1.5px solid #D9D9D9; border-radius: 5px;
      font-family: inherit; font-size: .875rem; font-weight: 600; cursor: pointer;
    }
    .knop-wit:hover { border-color: #999; }
    .knop-rood-sm {
      padding: 10px 20px; background: #E4032D; color: #fff; border: none;
      border-radius: 5px; font-family: inherit; font-size: .875rem; font-weight: 700; cursor: pointer;
    }
    .knop-rood-sm:hover { background: #A0021F; }
    .knop-gevaar {
      padding: 10px 20px; background: #fde8ea; color: #A0021F; border: none;
      border-radius: 5px; font-family: inherit; font-size: .875rem; font-weight: 600;
      cursor: pointer; margin-right: auto;
    }
    .knop-gevaar:hover { background: #fbc4c4; }
  </style>
</head>
<body>


<!-- ══ MODAL INSTELLINGEN ════════════════════════════════════════ -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3>⚙ Instellingen</h3>
    <label for="m-api">TomTom API-sleutel</label>
    <input type="password" id="m-api" placeholder="Laat leeg om huidige te behouden" autocomplete="off" />
    <label for="m-werk">Vertrekadres</label>
    <input type="text" id="m-werk" />
    <div class="modal-footer">
      <button class="knop-gevaar" onclick="resetAlles()">Wissen</button>
      <button class="knop-wit" onclick="sluitModal()">Annuleren</button>
      <button class="knop-rood-sm" onclick="slaModalOp()">Opslaan</button>
    </div>
  </div>
</div>

// ══ HELPERS ════════════════════════════════════════════════════════
function e(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function secNaarTekst(sec) {
  const m = Math.round(sec / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m/60)}u ${m%60 > 0 ? ' ' + (m%60) + 'm' : ''}`.trim();
}
function kmTekst(m) {
  return m >= 1000 ? `${(m/1000).toFixed(1)} km` : `${m} m`;
}
function wegKlasse(nr) {
  if (/^A\d/i.test(nr)) return 'A';
  if (/^N\d/i.test(nr)) return 'N';
  return 'R';
}

const PIN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E4032D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`;

// ══ ORIGIN COÖRDINATEN ════════════════════════════════════════════
// Vaste coördinaten van het Halfweg-kantoor — geen Search API nodig
const ORIGIN_STANDAARD = { lat: 52.3823, lon: 4.7348 }; // Suikersilo-West 39, Halfweg

// ══ TOMTOM ROUTING ════════════════════════════════════════════════
function parseWegnummers(instructies) {
  const gezien = new Set(), wegen = [];
  (instructies || []).forEach(ins => {
    (ins.roadNumbers || []).forEach(nr => {
      const n = nr.toUpperCase().replace(/\s+/g,'');
      if (!gezien.has(n) && /^[ANR]\d/.test(n)) { gezien.add(n); wegen.push(n); }
    });
    // Fallback: street-naam als het op een wegcode lijkt
    if (!ins.roadNumbers?.length && ins.street) {
      const n = ins.street.toUpperCase().replace(/\s+/g,'');
      if (!gezien.has(n) && /^[AN]\d/.test(n)) { gezien.add(n); wegen.push(n); }
    }
  });
  return wegen
    .sort((a,b) => (a.startsWith('A')?0:a.startsWith('N')?1:2) - (b.startsWith('A')?0:b.startsWith('N')?1:2))
    .slice(0, 4);
}

function bouwRouteTekst(instructies) {
  const segmenten = [], gezien = new Set();

  // Verzamel weg + eerste bord-richting per uniek wegnummer
  (instructies || []).forEach(ins => {
    if (['DEPART','ARRIVE','WAYPOINT_REACHED','SPEED_CONTROL'].includes(ins.instructionType)) return;
    const kandidaten = [];
    (ins.roadNumbers || []).forEach(nr => {
      const n = nr.toUpperCase().replace(/\s+/g,'');
      if (/^[AN]\d/.test(n)) kandidaten.push(n);
    });
    if (!kandidaten.length && ins.street) {
      const n = ins.street.toUpperCase().replace(/\s+/g,'');
      if (/^[AN]\d/.test(n)) kandidaten.push(n);
    }
    kandidaten.forEach(nr => {
      if (gezien.has(nr)) return;
      gezien.add(nr);
      const bord = (ins.signpostText || '').replace(/[-–—|]/g,' ').split(/\s{2,}/)[0].trim();
      segmenten.push({ nr, richting: (bord && bord.length < 22 && bord.toUpperCase() !== nr) ? bord : null });
    });
  });

  const lijst = segmenten.slice(0, 5);
  if (!lijst.length) return null;

  // Eerste weg krijgt richting mee als beschikbaar, rest alleen wegnummer
  const eerste = lijst[0];
  const eersteLabel = eerste.richting ? `${eerste.nr} richting ${eerste.richting}` : eerste.nr;

  if (lijst.length === 1) return `Je rijdt via de ${eersteLabel}.`;

  const rest = lijst.slice(1).map(s => s.nr);
  const laatste = rest[rest.length - 1];
  const midden  = rest.slice(0, -1);

  const weglijst = midden.length
    ? `${eersteLabel}, ${midden.join(', ')} en ${laatste}`
    : `${eersteLabel} en ${laatste}`;

  return `Je rijdt via de ${weglijst}.`;
}

function telFlitsers(instructies) {
  return (instructies || []).filter(ins => ins.instructionType === 'SPEED_CONTROL').length;
}

async function haalReistijd(b, poging = 1) {
  const key = (cfg.apiSleutel || '').trim();
  const url = `https://api.tomtom.com/routing/1/calculateRoute/${originCoords.lat},${originCoords.lon}:${b.lat},${b.lon}/json?key=${key}&traffic=true&travelMode=car&instructionsType=coded&language=nl-NL`;
  try {
    const res   = await fetch(url);
    if (!res.ok) {
      // Probeer foutmelding uit body te lezen
      let detail = `HTTP ${res.status}`;
      try { const j = await res.json(); detail = j?.detailedError?.message || j?.error?.description || detail; } catch {}
      throw new Error(detail);
    }
    const data  = await res.json();
    const route = data.routes?.[0];
    const sum   = route?.summary;
    if (!sum) throw new Error('Geen route in antwoord');
    const instructies = route?.guidance?.instructions ?? [];
    return {
      ok: true,
      rijSec:         sum.travelTimeInSeconds,
      normSec:        sum.noTrafficTravelTimeInSeconds ?? sum.travelTimeInSeconds,
      vertragingSec:  sum.trafficDelayInSeconds ?? 0,
      afstandM:       sum.lengthInMeters,
      wegen:          parseWegnummers(instructies),
      routeSegmenten: bouwRouteTekst(instructies),
      flitsers:       telFlitsers(instructies),
    };
  } catch (err) {
    if (poging < 2) {
      await new Promise(r => setTimeout(r, 1800));
      return haalReistijd(b, poging + 1);
    }
    return { ok: false, fout: err.message };
  }
}

// ══ KAART HTML ════════════════════════════════════════════════════
function kaartLadenHTML(b) {
  return `
    <div class="kaart-accent"></div>
    <div class="kaart-body">
      <div class="kaart-kop">
        <div><div class="plaatsnaam">${e(b.naam)}</div><div class="regio">${e(b.regio)}</div></div>
        <div class="pin-wrap">${PIN}</div>
      </div>
      <div class="rtijd-blok"><div class="laden-rij"><div class="spinner"></div>Ophalen…</div></div>
      <div class="kaart-onder">
        <div class="voortgangsbalk"><div class="voortgang g" style="width:0%"></div></div>
      </div>
    </div>`;
}

function kaartResultaatHTML(b, r) {
  if (!r.ok) {
    return `
      <div class="kaart-accent"></div>
      <div class="kaart-body">
        <div class="kaart-kop">
          <div><div class="plaatsnaam">${e(b.naam)}</div><div class="regio">${e(b.regio)}</div></div>
          <div class="pin-wrap">${PIN}</div>
        </div>
        <div class="rtijd-blok"><div class="rtijd gr">—</div></div>
        <div class="kaart-onder">
          <div class="rmeta" style="color:#E4032D;font-size:.65rem" title="${e(r.fout)}">${e(r.fout || 'Geen verbinding')}</div>
          <div class="voortgangsbalk"><div class="voortgang r" style="width:100%"></div></div>
        </div>
      </div>`;
  }

  const rat  = r.normSec > 0 ? r.rijSec / r.normSec : 1;
  const del  = r.vertragingSec;
  const kls  = (rat > 1.4 || del > 900) ? 'r' : (rat > 1.1 || del > 180) ? 'o' : 'g';
  const bdg  = kls === 'g' ? 'Vlot' : kls === 'o' ? 'Matig' : 'Druk';
  const pct  = Math.min(100, Math.round((r.rijSec / Math.max(r.normSec * 2.5, 1)) * 100));

  // Weg-chips HTML
  const wegenHTML = r.wegen?.length
    ? `<div class="wegen">${r.wegen.map(w => `<span class="weg ${wegKlasse(w)}">${e(w)}</span>`).join('')}</div>`
    : '';

  // Route quick-guide: escape elke segment afzonderlijk, dan samenvoegen met HTML-pijl
  const routeHTML = r.routeSegmenten
    ? `<div class="route-tekst">${e(r.routeSegmenten)}</div>`
    : '';

  // Flitspalen — altijd tonen, ook bij 0
  const flitserHTML = `<div class="flitspaal-badge${r.flitsers >= 3 ? ' veel' : ''}">
       ${FLITSPAAL}
       <div>
         <div class="flitspaal-nr">${r.flitsers}</div>
         <div class="flitspaal-label">flitspaal${r.flitsers !== 1 ? 'en' : ''}</div>
       </div>
     </div>`;

  // Vertraging
  const vertragingHTML = del > 60
    ? `<div class="vertraging ${kls}">${WARN} +${Math.round(del/60)} min${del > 900 ? ' vertraging' : ' extra'}</div>`
    : '';

  return `
    <div class="kaart-accent"></div>
    <div class="kaart-body">
      <div class="kaart-kop">
        <div><div class="plaatsnaam">${e(b.naam)}</div><div class="regio">${e(b.regio)}</div></div>
        <div class="pin-wrap">${PIN}</div>
      </div>
      <div class="rtijd-blok"><div class="rtijd ${kls}">${e(secNaarTekst(r.rijSec))}</div></div>
      <div class="kaart-onder">
        ${routeHTML}
        ${wegenHTML}
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          ${flitserHTML}
          ${vertragingHTML}
        </div>
        <div class="rmeta">
          ${e(kmTekst(r.afstandM))} &middot; normaal ${e(secNaarTekst(r.normSec))}
          <span class="badge ${kls}">${bdg}</span>
        </div>
        <div class="voortgangsbalk"><div class="voortgang ${kls}" style="width:${pct}%"></div></div>
      </div>
    </div>`;
}

// ══ RENDEREN ══════════════════════════════════════════════════════
function tekenLadende() {
  const rij = document.getElementById('kaarten-rij');
  rij.innerHTML = '';
  BESTEMMINGEN.forEach(b => {
    const div = document.createElement('div');
    div.className = 'kaart';
    div.id = 'k-' + b.naam.replace(/\s+/g,'-');
    div.innerHTML = kaartLadenHTML(b);
    setKaartBg(div, b.lat, b.lon);
    rij.appendChild(div);
  });
}

function laadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_SLEUTEL));
    if (c && c.tijdstip && c.resultaten && (Date.now() - c.tijdstip) < CACHE_TTL) return c;
  } catch {}
  return null;
}
function slaCache(resultaten) {
  try { localStorage.setItem(CACHE_SLEUTEL, JSON.stringify({ tijdstip: Date.now(), resultaten })); } catch {}
}

function toonResultaten(resultaten) {
  BESTEMMINGEN.forEach((b, i) => {
    const div = document.getElementById('k-' + b.naam.replace(/\s+/g,'-'));
    if (div) {
      div.innerHTML = kaartResultaatHTML(b, resultaten[i]);
      setKaartBg(div, b.lat, b.lon);
    }
  });
}

async function haalAlleReistijden() {
  clearTimeout(verversTimer);

  // Gebruik cache als die nog vers genoeg is
  const cache = laadCache();
  if (cache) {
    toonResultaten(cache.resultaten);
