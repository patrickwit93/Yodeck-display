<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Amstelland Ingenieurs — Klok</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;overflow:hidden;
  background:#1D1D1B;
  font-family:'Montserrat','Segoe UI',sans-serif;
  color:#fff;
}

/* ── achtergrondgrid ─── */
.bg{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(228,3,45,.038) 1px,transparent 1px),
    linear-gradient(90deg,rgba(228,3,45,.038) 1px,transparent 1px);
  background-size:68px 68px;
  pointer-events:none;z-index:0;
}

/* ── rode bovenlijn ─── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:4px;
  background:linear-gradient(to right,#A0021F,#E4032D,#A0021F);
  z-index:50;
}

/* ── scanline ─── */
.scan{
  position:fixed;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(228,3,45,.55),transparent);
  animation:scan 7s linear infinite;
  pointer-events:none;z-index:20;
}
@keyframes scan{
  0%{top:-4px;opacity:0}4%{opacity:1}96%{opacity:1}100%{top:100%;opacity:0}
}

/* ── hoekdecoraties ─── */
.cr{position:fixed;width:46px;height:46px;pointer-events:none;z-index:5}
.tl{top:20px;left:20px;border-top:2px solid #E4032D;border-left:2px solid #E4032D}
.tr{top:20px;right:20px;border-top:2px solid #E4032D;border-right:2px solid #E4032D}
.bl{bottom:20px;left:20px;border-bottom:2px solid #E4032D;border-left:2px solid #E4032D}
.br{bottom:20px;right:20px;border-bottom:2px solid #E4032D;border-right:2px solid #E4032D}

/* ── coördinaten ─── */
.co{
  position:fixed;font-size:10px;font-weight:300;
  letter-spacing:.18em;color:#616160;
  pointer-events:none;z-index:5;
}
.co-tl{top:24px;left:80px}
.co-tr{top:24px;right:80px}
.co-bl{bottom:24px;left:80px}
.co-br{bottom:24px;right:78px}

/* ── live indicator ─── */
.live{
  position:fixed;top:18px;right:82px;
  display:flex;align-items:center;gap:6px;z-index:15;
}
.livdot{
  width:7px;height:7px;border-radius:50%;
  background:#00E676;box-shadow:0 0 7px #00E676;
  animation:lp 2s ease-in-out infinite;
}
@keyframes lp{
  0%,100%{opacity:1;box-shadow:0 0 7px #00E676}
  50%{opacity:.5;box-shadow:0 0 2px #00E676}
}
.livtxt{font-size:10px;letter-spacing:.22em;color:#616160;font-weight:300}

/* ── hoofd-layout ─── */
.main{
  position:relative;z-index:10;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding-bottom:6vh;
}

/* ── klok wrapper ─── */
.cw{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}

/* pulserende ringen */
.p1{
  position:absolute;border-radius:50%;
  border:1.5px solid #E4032D;
  width:112%;height:112%;
  animation:pa 3.5s ease-in-out infinite;
  pointer-events:none;
}
.p2{
  position:absolute;border-radius:50%;
  border:1px solid rgba(228,3,45,.3);
  width:128%;height:128%;
  animation:pa 3.5s ease-in-out 1.75s infinite;
  pointer-events:none;
}
@keyframes pa{
  0%,100%{transform:scale(.97);opacity:.9}
  50%{transform:scale(1.02);opacity:.2}
}

/* roterende sierring */
.dr{
  position:absolute;border-radius:50%;
  width:140%;height:140%;
  border:1px dashed rgba(228,3,45,.18);
  animation:dr 120s linear infinite;
  pointer-events:none;
}
@keyframes dr{from{transform:rotate(0)}to{transform:rotate(360deg)}}

#cc{display:block;position:relative;z-index:2}

/* ── digitale tijd ─── */
.trow{
  display:flex;align-items:baseline;gap:4px;
  margin-top:14px;
}
.dhm{
  font-size:clamp(32px,4.8vw,68px);
  font-weight:200;letter-spacing:.04em;
  color:#fff;font-variant-numeric:tabular-nums;
}
.dsep{
  font-size:clamp(32px,4.8vw,68px);
  font-weight:100;color:#E4032D;
  animation:bl 1s step-start infinite;
}
@keyframes bl{0%,49%{opacity:1}50%,99%{opacity:.2}}
.dsec{
  font-size:clamp(16px,2.3vw,34px);
  font-weight:300;color:#E4032D;
  font-variant-numeric:tabular-nums;
  margin-left:3px;
  align-self:flex-start;
  margin-top:.1em;
}

.dayname{
  margin-top:5px;text-align:center;
  font-size:clamp(14px,1.7vw,24px);
  font-weight:700;letter-spacing:.26em;
  color:#fff;text-transform:uppercase;
}
.daterow{
  margin-top:2px;text-align:center;
  font-size:clamp(11px,1.2vw,17px);
  font-weight:300;letter-spacing:.18em;
  color:#D9D9D9;
}


/* ── logo ─── */
.logo{
  position:fixed;bottom:22px;right:34px;
  z-index:45;opacity:.88;
}
.logo svg{width:clamp(120px,9.5vw,175px);height:auto}
</style>
</head>
<body>

<div class="bg"></div>
<div class="topbar"></div>
<div class="scan"></div>

<div class="cr tl"></div><div class="cr tr"></div>
<div class="cr bl"></div><div class="cr br"></div>

<div class="co co-tl">N 52°22′48″</div>
<div class="co co-tr">E 04°53′31″</div>
<div class="co co-bl">AMSTERDAM</div>
<div class="co co-br">UTC+01:00</div>

<div class="live"><div class="livdot"></div><span class="livtxt">LIVE</span></div>

<!-- Klok -->
<div class="main">
  <div class="cw" id="cw">
    <div class="dr"></div>
    <div class="p1"></div>
    <div class="p2"></div>
    <canvas id="cc"></canvas>
  </div>
  <div class="trow">
    <span class="dhm" id="dhm">--:--</span>
    <span class="dsep">:</span>
    <span class="dsec" id="dsec">--</span>
  </div>
  <div class="dayname" id="dn">---</div>
  <div class="daterow" id="dr">-- --- ----</div>
</div>

<script>
// ══════════════════════════════════════════
//  KLOK (canvas)
// ══════════════════════════════════════════
const canvas = document.getElementById('cc');
const ctx    = canvas.getContext('2d');
const dpr    = window.devicePixelRatio || 1;

const DAGEN   = ['ZONDAG','MAANDAG','DINSDAG','WOENSDAG','DONDERDAG','VRIJDAG','ZATERDAG'];
const MAANDEN = ['JANUARI','FEBRUARI','MAART','APRIL','MEI','JUNI',
                 'JULI','AUGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DECEMBER'];

function getRadius(){
  return Math.min(
    Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.40),
    320
  );
}

function resizeClock(){
  const r  = getRadius();
  const sz = r * 2;
  canvas.width  = sz * dpr;
  canvas.height = sz * dpr;
  canvas.style.width  = sz + 'px';
  canvas.style.height = sz + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeClock);
resizeClock();

function pad(n){ return String(n).padStart(2,'0'); }

function getWeek(d){
  const dt = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7));
  const y1 = new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-y1)/864e5)+1)/7);
}

function drawClock(){
  const r  = getRadius();
  const sz = r * 2;
  if(canvas.width !== sz*dpr){
    canvas.width = sz*dpr; canvas.height = sz*dpr;
    canvas.style.width = sz+'px'; canvas.style.height = sz+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  ctx.clearRect(0,0,sz,sz);
  const cx=r, cy=r;
  const now = new Date();

  // achtergrond klokblad
  const bg = ctx.createRadialGradient(cx,cy-r*.22,r*.04,cx,cy,r);
  bg.addColorStop(0,'#2e2e2c');
  bg.addColorStop(1,'#111110');
  ctx.beginPath();ctx.arc(cx,cy,r-1,0,2*Math.PI);
  ctx.fillStyle=bg;ctx.fill();

  // subtiel glanseffect
  const gl = ctx.createRadialGradient(cx,cy-r*.3,r*.06,cx,cy,r*.9);
  gl.addColorStop(0,'rgba(255,255,255,.05)');
  gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(cx,cy,r-2,0,2*Math.PI);
  ctx.fillStyle=gl;ctx.fill();

  // buitenrand
  ctx.beginPath();ctx.arc(cx,cy,r-1,0,2*Math.PI);
  ctx.strokeStyle='#3e3e3c';ctx.lineWidth=3;ctx.stroke();
  // rode accentrij
  ctx.beginPath();ctx.arc(cx,cy,r*.96,0,2*Math.PI);
  ctx.strokeStyle='#E4032D';ctx.lineWidth=1.8;ctx.stroke();

  // streepjes (60x)
  for(let i=0;i<60;i++){
    const a = (i/60)*2*Math.PI - Math.PI/2;
    const isH = i%5===0, isM = i%15===0;
    const o = r*.94;
    const n = isM ? r*.70 : isH ? r*.80 : r*.87;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*n, cy+Math.sin(a)*n);
    ctx.lineTo(cx+Math.cos(a)*o, cy+Math.sin(a)*o);
    ctx.strokeStyle = isM?'#E4032D':isH?'#FFFFFF':'#4a4a48';
    ctx.lineWidth   = isM?2.8:isH?1.6:.9;
    ctx.stroke();
  }

  // cijfers
  ctx.textAlign='center';ctx.textBaseline='middle';
  const nr = r*.64;
  for(let i=1;i<=12;i++){
    const a=(i/12)*2*Math.PI-Math.PI/2;
    const main=(i%3===0);
    ctx.font=`${main?'600':'300'} ${Math.floor(r*(main?.118:.096))}px 'Montserrat',sans-serif`;
    ctx.fillStyle = main?'#FFFFFF':'#7a7a76';
    ctx.fillText(i, cx+Math.cos(a)*nr, cy+Math.sin(a)*nr);
  }

  // tijdshoeken (vloeiend)
  const h=now.getHours()%12, m=now.getMinutes(),
        s=now.getSeconds(), ms=now.getMilliseconds();
  const sa = ((s+ms/1e3)/60)         *2*Math.PI-Math.PI/2;
  const ma = ((m+(s+ms/1e3)/60)/60)  *2*Math.PI-Math.PI/2;
  const ha = ((h+(m+s/60)/60)/12)    *2*Math.PI-Math.PI/2;

  function hand(a,len,w,col,sh,tail){
    const tl=tail||len*.18;
    ctx.save();ctx.lineCap='round';
    if(sh){ctx.shadowColor=col;ctx.shadowBlur=sh;}
    ctx.beginPath();
    ctx.moveTo(cx-Math.cos(a)*tl, cy-Math.sin(a)*tl);
    ctx.lineTo(cx+Math.cos(a)*len, cy+Math.sin(a)*len);
    ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();
    ctx.restore();
  }

  // uurwijs (tip rood)
  hand(ha,r*.50,r*.048,'#D9D9D9',4);
  ctx.save();ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(ha)*r*.34,cy+Math.sin(ha)*r*.34);
  ctx.lineTo(cx+Math.cos(ha)*r*.50,cy+Math.sin(ha)*r*.50);
  ctx.strokeStyle='#E4032D';ctx.lineWidth=r*.048;ctx.stroke();
  ctx.restore();

  // minuutwijs (tip rood)
  hand(ma,r*.72,r*.034,'#D9D9D9',4);
  ctx.save();ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(ma)*r*.54,cy+Math.sin(ma)*r*.54);
  ctx.lineTo(cx+Math.cos(ma)*r*.72,cy+Math.sin(ma)*r*.72);
  ctx.strokeStyle='#E4032D';ctx.lineWidth=r*.034;ctx.stroke();
  ctx.restore();

  // secondewijs (rood)
  hand(sa,r*.83,r*.015,'#E4032D',16,r*.24);
  ctx.beginPath();
  ctx.arc(cx+Math.cos(sa)*r*.83,cy+Math.sin(sa)*r*.83,r*.024,0,2*Math.PI);
  ctx.fillStyle='#E4032D';ctx.shadowColor='#E4032D';ctx.shadowBlur=12;ctx.fill();
  ctx.shadowBlur=0;

  // middenas
  ctx.beginPath();ctx.arc(cx,cy,r*.058,0,2*Math.PI);
  ctx.fillStyle='#1c1c1a';ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,r*.038,0,2*Math.PI);
  ctx.fillStyle='#E4032D';ctx.shadowColor='#E4032D';ctx.shadowBlur=12;ctx.fill();
  ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(cx,cy,r*.013,0,2*Math.PI);
  ctx.fillStyle='#fff';ctx.fill();

  // ── DOM bijwerken ──
  document.getElementById('dhm').textContent=`${pad(now.getHours())}:${pad(m)}`;
  document.getElementById('dsec').textContent=pad(s);
  document.getElementById('dn').textContent=DAGEN[now.getDay()];
  document.getElementById('dr').textContent=`${pad(now.getDate())} ${MAANDEN[now.getMonth()]} ${now.getFullYear()}`;

  requestAnimationFrame(drawClock);
}
drawClock();





</script>
</body>
</html>
