<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amstelland Ingenieurs — Tijdweergave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --rood:        #E4032D;
            --donkerrood:  #A0021F;
            --zwart:       #1D1D1B;
            --donkergrijs: #484848;
            --middengrijs: #616160;
            --lichtgrijs:  #D9D9D9;
            --wit:         #FFFFFF;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--zwart);
            font-family: 'Montserrat', 'Calibri Light', 'Segoe UI', sans-serif;
            color: var(--wit);
        }

        /* ── Achtergrond raster ────────────────────────────────────── */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(228,3,45,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(228,3,45,0.045) 1px, transparent 1px);
            background-size: 64px 64px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Scanline ──────────────────────────────────────────────── */
        .scan-line {
            position: fixed;
            left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, rgba(228,3,45,0.55) 40%, rgba(228,3,45,0.55) 60%, transparent 100%);
            animation: scan 6s linear infinite;
            pointer-events: none;
            z-index: 20;
        }
        @keyframes scan {
            0%   { top: -4px; opacity: 0; }
            3%   { opacity: 1; }
            97%  { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* ── Hoekdecoraties ────────────────────────────────────────── */
        .corner {
            position: fixed;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: 5;
        }
        .corner-tl { top: 24px; left: 24px;  border-top: 2px solid var(--rood); border-left: 2px solid var(--rood); }
        .corner-tr { top: 24px; right: 24px;  border-top: 2px solid var(--rood); border-right: 2px solid var(--rood); }
        .corner-bl { bottom: 24px; left: 24px;  border-bottom: 2px solid var(--rood); border-left: 2px solid var(--rood); }
        .corner-br { bottom: 24px; right: 24px;  border-bottom: 2px solid var(--rood); border-right: 2px solid var(--rood); }

        /* ── Coördinaten ───────────────────────────────────────────── */
        .coord {
            position: fixed;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.18em;
            color: var(--middengrijs);
            z-index: 5;
            pointer-events: none;
        }
        .coord-tl { top: 28px;    left: 100px; }
        .coord-tr { top: 28px;    right: 100px; }
        .coord-bl { bottom: 28px; left: 100px; }
        .coord-br { bottom: 28px; right: 110px; }

        /* ── Brugdecoratie (onderkant) ─────────────────────────────── */
        .bridge-deco {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.18;
        }

        /* ── Hoofd-layout ──────────────────────────────────────────── */
        .main {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Kloksectie ────────────────────────────────────────────── */
        .clock-section {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px 0 60px;
        }

        .clock-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Kloppende ring */
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid var(--rood);
            width: 108%;
            height: 108%;
            animation: pulse 3.5s ease-in-out infinite;
            pointer-events: none;
        }
        .pulse-ring-2 {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(228,3,45,0.35);
            width: 118%;
            height: 118%;
            animation: pulse 3.5s ease-in-out 1.75s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%   { transform: scale(0.97); opacity: 0.9; }
            50%  { transform: scale(1.02); opacity: 0.25; }
            100% { transform: scale(0.97); opacity: 0.9; }
        }

        /* Langzaam roterende decoratieve ring */
        .deco-ring {
            position: absolute;
            border-radius: 50%;
            width: 130%;
            height: 130%;
            border: 1px solid rgba(228,3,45,0.15);
            animation: slow-rotate 90s linear infinite;
            pointer-events: none;
        }
        .deco-ring::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -6px;
            width: 10px;
            height: 2px;
            background: var(--rood);
            transform: translateY(-50%);
            border-radius: 1px;
        }
        .deco-ring::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -6px;
            width: 10px;
            height: 2px;
            background: var(--rood);
            transform: translateY(-50%);
            border-radius: 1px;
        }
        @keyframes slow-rotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        #clockCanvas {
            display: block;
            position: relative;
            z-index: 2;
            /* Scherp op retina */
            image-rendering: -webkit-optimize-contrast;
        }

        /* ── Verticale scheidingslijn ───────────────────────────────── */
        .divider {
            flex: 0 0 1px;
            height: 55vh;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(228,3,45,0.6) 20%,
                rgba(228,3,45,0.6) 80%,
                transparent 100%);
            margin: 0 10px;
        }

        /* ── Infopaneel (rechts) ───────────────────────────────────── */
        .info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 0 50px 0 50px;
            gap: 10px;
            min-width: 0;
        }

        .time-label {
            font-size: clamp(9px, 0.9vw, 13px);
            font-weight: 400;
            letter-spacing: 0.42em;
            color: var(--rood);
            text-transform: uppercase;
        }

        /* Grote digitale tijd */
        .digital-time {
            display: flex;
            align-items: baseline;
            gap: 0;
            line-height: 1;
            white-space: nowrap;
        }
        .dt-hm {
            font-size: clamp(72px, 9.5vw, 148px);
            font-weight: 200;
            letter-spacing: -0.01em;
            color: var(--wit);
            font-variant-numeric: tabular-nums;
        }
        .dt-sep {
            font-size: clamp(72px, 9.5vw, 148px);
            font-weight: 100;
            color: var(--rood);
            margin: 0 2px;
            animation: blink-sep 1s step-start infinite;
        }
        @keyframes blink-sep {
            0%, 49% { opacity: 1; }
            50%, 99% { opacity: 0.25; }
        }
        .dt-sec {
            font-size: clamp(28px, 3.8vw, 60px);
            font-weight: 300;
            color: var(--rood);
            font-variant-numeric: tabular-nums;
            margin-left: 8px;
            align-self: flex-start;
            margin-top: 0.12em;
        }

        /* Horizontale lijn */
        .h-line {
            width: min(140px, 40%);
            height: 2px;
            background: linear-gradient(to right, var(--rood), transparent);
            margin: 4px 0;
        }

        .day-name {
            font-size: clamp(22px, 2.8vw, 46px);
            font-weight: 700;
            letter-spacing: 0.22em;
            color: var(--wit);
            text-transform: uppercase;
        }

        .date-display {
            font-size: clamp(14px, 1.7vw, 26px);
            font-weight: 300;
            letter-spacing: 0.14em;
            color: var(--lichtgrijs);
        }

        /* Week‑ en UTC-info */
        .meta-row {
            display: flex;
            gap: 24px;
            margin-top: 6px;
        }
        .meta-tag {
            font-size: clamp(9px, 0.85vw, 12px);
            font-weight: 400;
            letter-spacing: 0.3em;
            color: var(--middengrijs);
            text-transform: uppercase;
            border-left: 2px solid var(--rood);
            padding-left: 8px;
        }

        /* ── Amstelland logo (rechtsonder) ──────────────────────────── */
        .logo-container {
            position: fixed;
            bottom: 28px;
            right: 36px;
            z-index: 15;
            opacity: 0.92;
        }
        .logo-container svg {
            width: clamp(140px, 12vw, 200px);
            height: auto;
        }

        /* ── Rode bovenlijn ─────────────────────────────────────────── */
        .top-line {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(to right, var(--donkerrood), var(--rood), var(--donkerrood));
            z-index: 25;
        }

        /* ── Status indicator (rechtsbovenhoek) ─────────────────────── */
        .status-dot {
            position: fixed;
            top: 22px;
            right: 100px;
            display: flex;
            align-items: center;
            gap: 7px;
            z-index: 15;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00E676;
            box-shadow: 0 0 8px #00E676;
            animation: dot-pulse 2s ease-in-out infinite;
        }
        @keyframes dot-pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #00E676; }
            50%       { opacity: 0.5; box-shadow: 0 0 2px #00E676; }
        }
        .status-text {
            font-size: 10px;
            letter-spacing: 0.25em;
            color: var(--middengrijs);
            font-weight: 300;
        }
    </style>
</head>

    <div class="bg-grid"></div>

                <div class="meta-tag" id="tz-tag">CET / CEST</div>

    <script>
    // ── Constanten ───────────────────────────────────────────────────────
    const ROOD       = '#E4032D';
    const DONKERROOD = '#A0021F';
    const WIT        = '#FFFFFF';
    const LICHTGRIJS = '#D9D9D9';
    const MIDGRIJS   = '#616160';
    const DARKFILL   = '#252523';
    const ZWART      = '#1D1D1B';

    const DAGEN   = ['ZONDAG','MAANDAG','DINSDAG','WOENSDAG','DONDERDAG','VRIJDAG','ZATERDAG'];
    const MAANDEN = ['JANUARI','FEBRUARI','MAART','APRIL','MEI','JUNI',
                     'JULI','AUGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DECEMBER'];

    // ── Canvas setup ────────────────────────────────────────────────────
    const canvas  = document.getElementById('clockCanvas');
    const ctx     = canvas.getContext('2d');
    const dpr     = window.devicePixelRatio || 1;

    function getRadius() {
        // Responsief: 38% van de kleinste dimensie van het viewport, max 300px
        return Math.min(Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.38), 300);
    }

    function resizeClock() {
        const r = getRadius();
        const size = r * 2;
        canvas.width  = size * dpr;
        canvas.height = size * dpr;
        canvas.style.width  = size + 'px';
        canvas.style.height = size + 'px';
        ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resizeClock);
    resizeClock();

    // ── Week-nummer ──────────────────────────────────────────────────────
    function getWeekNumber(d) {
        const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
        const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
        return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    // ── Klok tekenen ────────────────────────────────────────────────────
    function drawClock() {
        const now = new Date();
        const r   = getRadius();
        const cx  = r, cy = r;

        // Volledig herberekenen bij resize
        const size = r * 2;
        if (canvas.width !== size * dpr) {
            canvas.width  = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width  = size + 'px';
            canvas.style.height = size + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        ctx.clearRect(0, 0, size, size);

        // ── Klokblad ────────────────────────────────────────────────────
        // Buitenste donkere cirkel
        ctx.beginPath();
        ctx.arc(cx, cy, r - 1, 0, 2 * Math.PI);
        const bgGrad = ctx.createRadialGradient(cx, cy - r*0.2, r*0.05, cx, cy, r);
        bgGrad.addColorStop(0, '#2c2c2a');
        bgGrad.addColorStop(1, '#131312');
        ctx.fillStyle = bgGrad;
        ctx.fill();

        // Subtiele binnenste glans
        const glowGrad = ctx.createRadialGradient(cx, cy - r*0.3, r*0.1, cx, cy, r*0.9);
        glowGrad.addColorStop(0, 'rgba(255,255,255,0.04)');
        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, r - 2, 0, 2 * Math.PI);
        ctx.fillStyle = glowGrad;
        ctx.fill();

        // ── Technische rand ──────────────────────────────────────────────
        // Buitenste ring
        ctx.beginPath();
        ctx.arc(cx, cy, r - 1, 0, 2 * Math.PI);
        ctx.strokeStyle = '#444442';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Rode accentrij
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.95, 0, 2 * Math.PI);
        ctx.strokeStyle = ROOD;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // ── Graadmarkeringen (60 stuks) ──────────────────────────────────
        for (let i = 0; i < 60; i++) {
            const angle = (i / 60) * 2 * Math.PI - Math.PI / 2;
            const isHour = i % 5 === 0;
            const isMain = i % 15 === 0;  // 12, 3, 6, 9

            const outer = r * 0.93;
            const inner = isMain ? r * 0.72 : (isHour ? r * 0.80 : r * 0.87);
            const lw    = isMain ? 2.5 : (isHour ? 1.5 : 0.8);
            const col   = isMain ? ROOD : (isHour ? WIT : '#555553');

            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
            ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
            ctx.strokeStyle = col;
            ctx.lineWidth = lw;
            ctx.stroke();
        }

        // ── Cijfers (1–12) ───────────────────────────────────────────────
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        const numR = r * 0.65;
        for (let i = 1; i <= 12; i++) {
            const angle = (i / 12) * 2 * Math.PI - Math.PI / 2;
            const x = cx + Math.cos(angle) * numR;
            const y = cy + Math.sin(angle) * numR;
            const isMain = (i % 3 === 0);
            ctx.font = `${isMain ? '600' : '300'} ${Math.floor(r * (isMain ? 0.115 : 0.095))}px 'Montserrat', sans-serif`;
            ctx.fillStyle = isMain ? WIT : '#888886';
            ctx.fillText(i, x, y);
        }

        // ── Tijdsberekening (vloeiend) ───────────────────────────────────
        const h  = now.getHours() % 12;
        const m  = now.getMinutes();
        const s  = now.getSeconds();
        const ms = now.getMilliseconds();

        const secAngle = ((s + ms / 1000) / 60)                * 2 * Math.PI - Math.PI / 2;
        const minAngle = ((m + (s + ms / 1000) / 60) / 60)     * 2 * Math.PI - Math.PI / 2;
        const hrAngle  = ((h + (m + s / 60) / 60) / 12)        * 2 * Math.PI - Math.PI / 2;

        // ── Helper: wijs tekenen ─────────────────────────────────────────
        function drawHand(angle, length, width, color, shadow, tailLen) {
            const tail = tailLen || length * 0.18;
            ctx.save();
            ctx.lineCap = 'round';
            if (shadow) {
                ctx.shadowColor   = color;
                ctx.shadowBlur    = shadow;
            }
            ctx.beginPath();
            ctx.moveTo(cx - Math.cos(angle) * tail, cy - Math.sin(angle) * tail);
            ctx.lineTo(cx + Math.cos(angle) * length, cy + Math.sin(angle) * length);
            ctx.strokeStyle = color;
            ctx.lineWidth   = width;
            ctx.stroke();
            ctx.restore();
        }

        // Uurwijs
        drawHand(hrAngle,  r * 0.52, r * 0.046, WIT,    6);
        // Rode tip op uurwijs
        ctx.save();
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(hrAngle) * r * 0.38, cy + Math.sin(hrAngle) * r * 0.38);
        ctx.lineTo(cx + Math.cos(hrAngle) * r * 0.52, cy + Math.sin(hrAngle) * r * 0.52);
        ctx.strokeStyle = ROOD;
        ctx.lineWidth = r * 0.046;
        ctx.stroke();
        ctx.restore();

        // Minuutwijs
        drawHand(minAngle, r * 0.73, r * 0.032, WIT,    5);
        // Rode tip op minuutwijs
        ctx.save();
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(minAngle) * r * 0.56, cy + Math.sin(minAngle) * r * 0.56);
        ctx.lineTo(cx + Math.cos(minAngle) * r * 0.73, cy + Math.sin(minAngle) * r * 0.73);
        ctx.strokeStyle = ROOD;
        ctx.lineWidth = r * 0.032;
        ctx.stroke();
        ctx.restore();

        // Secondewijs (rood, dun, met gloed)
        drawHand(secAngle, r * 0.84, r * 0.014, ROOD,   14, r * 0.22);

        // Secondewijs uiteinde-dot
        ctx.beginPath();
        ctx.arc(
            cx + Math.cos(secAngle) * r * 0.84,
            cy + Math.sin(secAngle) * r * 0.84,
            r * 0.022, 0, 2 * Math.PI
        );
        ctx.fillStyle = ROOD;
        ctx.shadowColor = ROOD;
        ctx.shadowBlur  = 10;
        ctx.fill();
        ctx.shadowBlur  = 0;

        // ── Middenpunt ────────────────────────────────────────────────────
        // Buitenste ring
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.055, 0, 2 * Math.PI);
        ctx.fillStyle = '#252523';
        ctx.fill();

        // Rode kern
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.036, 0, 2 * Math.PI);
        ctx.fillStyle = ROOD;
        ctx.shadowColor = ROOD;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Wit middenstip
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.012, 0, 2 * Math.PI);
        ctx.fillStyle = WIT;
        ctx.fill();

        // ── DOM bijwerken ────────────────────────────────────────────────
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('dt-hm').textContent  = `${pad(now.getHours())}:${pad(m)}`;
        document.getElementById('dt-sec').textContent = pad(s);

        document.getElementById('day-name').textContent    = DAGEN[now.getDay()];
        document.getElementById('date-display').textContent =
            `${pad(now.getDate())} ${MAANDEN[now.getMonth()]} ${now.getFullYear()}`;

        document.getElementById('week-tag').textContent = `WEEK ${pad(getWeekNumber(now))}`;
        document.getElementById('tz-tag').textContent   =
            now.getTimezoneOffset() <= -120 ? 'CEST / UTC+2' : 'CET / UTC+1';

        requestAnimationFrame(drawClock);
    }

    drawClock();
    </script>
