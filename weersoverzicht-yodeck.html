<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Weersoverzicht — Amstelland Ingenieurs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden; background: #111;
    }

    .screen {
      width: 1920px; height: 1080px;
      transform-origin: top left;
      display: flex; flex-direction: column;
      font-family: 'Montserrat', 'Calibri Light', Arial, sans-serif;
      background: #1A1A18;
      color: #FFF;
      overflow: hidden;
    }

    /* ════════════════ HEADER ════════════════ */
    .header {
      height: 96px; flex-shrink: 0;
      background: #1D1D1B;
      border-bottom: 3px solid #E4032D;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 52px;
    }
    .logo-wrap svg { height: 58px; width: auto; }
    .header-title {
      font-size: 30px; font-weight: 300;
      letter-spacing: 10px; text-transform: uppercase;
    }
    .header-title em { color: #E4032D; font-style: normal; }
    .header-clock { text-align: right; }
    .header-time  { font-size: 44px; font-weight: 300; letter-spacing: 2px; line-height: 1; }
    .header-date  { font-size: 13px; color: #616160; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

    /* ════════════════ TEGEL-GRID ════════════════
       12 kolommen → rij 1: 4 × 3 col  | rij 2: 3 × 4 col
    ════════════════════════════════════════════ */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 14px;
      padding: 16px 36px 14px;
    }

    /* ════════════════ TEGEL ════════════════ */
    .tile {
      background: #232321;
      border-radius: 10px;
      border-left: 4px solid #E4032D;
      padding: 20px 22px 18px;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    /* subtiel gloed linksboven */
    .tile::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 160px; height: 160px;
      background: radial-gradient(circle at top left, rgba(228,3,45,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Tegel kop ── */
    .tile-head {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .city-name {
      font-size: 20px; font-weight: 700;
      color: #E4032D; letter-spacing: 2.5px;
      text-transform: uppercase; line-height: 1.1;
    }
    .city-region {
      font-size: 10px; color: #484848;
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-top: 3px;
    }
    .weather-icon-big {
      font-size: 72px; line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
      margin-top: -4px;
    }

    /* ── Temperatuur ── */
    .temp-row {
      display: flex; align-items: baseline;
      gap: 6px; margin-bottom: 2px;
    }
    .temperature {
      font-size: 96px; font-weight: 300;
      line-height: 0.9; color: #FFF;
    }
    .temp-unit { font-size: 36px; color: #E4032D; }
    .feels-like { font-size: 13px; color: #484848; margin-bottom: 8px; margin-top: 6px; }

    .weather-desc {
      font-size: 17px; font-weight: 300;
      color: #D9D9D9; letter-spacing: 0.3px;
    }

    /* ── Divider ── */
    .div { height: 1px; margin: 10px 0;
      background: linear-gradient(to right, #E4032D 0%, rgba(228,3,45,0.2) 50%, transparent 100%); }

    /* ── Stats balk ── */
    .stats {
      display: flex; gap: 0;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      padding-right: 10px;
    }
    .stat-label {
      font-size: 10px; color: #484848;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 4px; white-space: nowrap;
    }
    .stat-value {
      font-size: 15px; font-weight: 600;
      color: #D9D9D9; white-space: nowrap;
    }

    /* ── Zon rij ── */
    .sun-row {
      display: flex; gap: 16px;
      margin-top: 2px;
    }
    .sun-item { display: flex; flex-direction: column; }

    /* ── Forecast ── */
    .forecast-section { margin-top: auto; padding-top: 14px; }
    .forecast-label {
      font-size: 10px; color: #484848;
      letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .forecast-row { display: flex; gap: 6px; }
    .fc-item {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 7px;
      padding: 12px 6px 10px;
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
    }
    .fc-day  { font-size: 11px; color: #616160; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
    .fc-icon { font-size: 26px; line-height: 1; }
    .fc-temps { display: flex; gap: 6px; align-items: baseline; }
    .fc-hi { font-size: 16px; font-weight: 700; color: #FFF; }
    .fc-lo { font-size: 13px; color: #484848; }

    /* ════════════════ FOOTER ════════════════ */
    .footer {
      height: 46px; flex-shrink: 0;
      background: #141412; border-top: 1px solid #2A2A28;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 52px;
    }
    .footer-left { display: flex; align-items: center; gap: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #E4032D; animation: blink 2.5s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.2;transform:scale(.7)} }
    .footer-txt  { font-size: 12px; color: #484848; letter-spacing: .5px; }
    .footer-src  { font-size: 11px; color: #333; letter-spacing: 1px; }

    /* ════════════════ LOADING / ERROR ════════════════ */
    .state-c { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
    .spinner { width:30px; height:30px; border:2px solid #2A2A28; border-top-color:#E4032D; border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .state-lbl { font-size:11px; color:#484848; letter-spacing:1px; text-transform:uppercase; }
    .state-err { color:#E4032D; }
  </style>
</head>

  const m = url.match(/\/([a-z]+)\.png$/i);
  const c = m ? m[1].toLowerCase() : '';

            n:'🌨️',o:'🌨️',p:'❄️',q:'🌧️',r:'🌦️',s:'⛈️',
            t:'🌧️',u:'🌨️',v:'🌧️',w:'🌦️',ww:'🌦️' }[c] || '🌡️');
}

// ── Buienradar: weatherdescription → emoji ──────────
function descEmoji(desc) {
  if (!desc) return '🌡️';
  const d = desc.toLowerCase();
  if (d.includes('onweer'))             return '⛈️';
  if (d.includes('hagel'))              return '🌨️';
  if (d.includes('sneeuw'))             return '❄️';
  if (d.includes('motregen'))           return '🌦️';
  if (d.includes('buien'))              return '🌧️';
  if (d.includes('regen'))              return '🌧️';
  if (d.includes('mist')||d.includes('nevel')) return '🌫️';
  if (d.includes('zonnig')||d.includes('helder')) return '☀️';
  if (d.includes('licht bewolkt'))      return '🌤️';
  if (d.includes('gedeeltelijk'))       return '⛅';
  if (d.includes('bewolkt'))            return '☁️';
  return '🌡️';
}

// ── Hulpfuncties ────────────────────────────────────
const R = n => Math.round(n);

// Haversine-afstand in km
function km(lat1, lon1, lat2, lon2) {
  const dL = (lat2-lat1)*Math.PI/180, dO = (lon2-lon1)*Math.PI/180;
  const a  = Math.sin(dL/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dO/2)**2;
  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function dichtstbij(staties, loc) {
  return staties.reduce((best, st) => {
    const d = km(loc.lat, loc.lon, st.lat, st.lon);
    return d < best.d ? {st, d} : best;
  }, {st: null, d: Infinity}).st;
}

function dagNaam(isoStr, index) {
  if (index === 1) return 'Morgen';
  const d = new Date(isoStr);
  return ['Zo','Ma','Di','Wo','Do','Vr','Za'][d.getDay()];
}

// ── Schaal aanpassing ───────────────────────────────
function fitScreen() {
  const s = document.getElementById('screen');
  const sx = window.innerWidth/1920, sy = window.innerHeight/1080;
  const sc = Math.min(sx, sy);
  s.style.transform = `scale(${sc})`;
  s.style.marginLeft = ((window.innerWidth  - 1920*sc)/2)+'px';
  s.style.marginTop  = ((window.innerHeight - 1080*sc)/2)+'px';
}

// ── Klok ────────────────────────────────────────────
function tickClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  const d = n.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('dateline').textContent = d.charAt(0).toUpperCase()+d.slice(1);
}

// ── HTML builders ───────────────────────────────────
function loadingTile(loc) {
  return `<div class="tile">
    <div class="tile-head">
      <div><div class="city-name">${loc.name}</div><div class="city-region">${loc.region}</div></div>
    </div>
    <div class="state-c"><div class="spinner"></div><span class="state-lbl">Laden…</span></div>
  </div>`;
}

function errorTile(loc) {
  return `<div class="tile">
    <div class="tile-head">
      <div><div class="city-name">${loc.name}</div><div class="city-region">${loc.region}</div></div>
    </div>
    <div class="state-c"><span style="font-size:42px">⚠️</span><span class="state-lbl state-err">Geen verbinding</span></div>
  </div>`;
}

function safeR(val) {
  const n = parseFloat(val);
  return isNaN(n) ? '—' : Math.round(n);
}

function buildTile(loc, station, fcData) {
  // Icoon: probeer beschrijving eerst, valt terug op iconurl van station
  const iconViaDesc = descEmoji(station.weatherdescription);
  const icon = (iconViaDesc !== '🌡️')
    ? iconViaDesc
    : iconEmoji(station.iconurl);

  // Buienradar windspeed is in m/s → omrekenen naar km/u
  const windkmh = station.windspeed != null ? R(station.windspeed * 3.6) : '—';
  const windRic = station.winddirection || '—';
  const neerslag = station.rainFallLastHour != null
    ? station.rainFallLastHour.toFixed(1) + ' mm' : '—';
  const temp     = station.temperature     != null ? R(station.temperature)     : '—';
  const feelTemp = station.feeltemperature != null ? R(station.feeltemperature) : '—';

  // 4-daagse forecast op basis van Open-Meteo (locatie-specifiek)
  const fcHTML = fcData
    ? [1,2,3,4].map(i => `
        <div class="fc-item">
          <div class="fc-day">${dagNaam(fcData.time[i], i)}</div>
          <div class="fc-icon">${wmoEmoji(fcData.weather_code[i])}</div>
          <div class="fc-temps">
            <span class="fc-hi">${safeR(fcData.temperature_2m_max[i])}°</span>
            <span class="fc-lo">${safeR(fcData.temperature_2m_min[i])}°</span>
          </div>
        </div>`).join('')
    : [1,2,3,4].map(() => `
        <div class="fc-item">
          <div class="fc-icon" style="font-size:18px;margin:auto">—</div>
        </div>`).join('');

  return `<div class="tile">
    <div class="tile-head">
      <div>
        <div class="city-name">${loc.name}</div>
        <div class="city-region">${loc.region}</div>
      </div>
      <div class="weather-icon-big">${icon}</div>
    </div>

    <div class="temp-row">
      <div class="temperature">${temp}</div>
      <div class="temp-unit">°C</div>
    </div>
    <div class="feels-like">Voelt als ${feelTemp}°C</div>
    <div class="weather-desc">${station.weatherdescription || '—'}</div>

    <div class="div"></div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Wind</span>
        <span class="stat-value">${windkmh} km/u ${windRic}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Vochtigheid</span>
        <span class="stat-value">${station.humidity != null ? station.humidity : '—'}%</span>
      </div>
      <div class="stat">
        <span class="stat-label">Neerslag (uur)</span>
        <span class="stat-value">${neerslag}</span>
      </div>
    </div>

    <div class="forecast-section">
      <div class="div"></div>
      <div class="forecast-label">4-daagse verwachting · Buienradar</div>
      <div class="forecast-row">${fcHTML}</div>
    </div>
  </div>`;
}

// ── WMO-code → emoji (voor Open-Meteo forecast) ────
function wmoEmoji(code) {
  if (code === 0)              return '☀️';
  if (code === 1)              return '🌤️';
  if (code === 2)              return '⛅';
  if (code === 3)              return '☁️';
  if (code <= 48)              return '🌫️';
  if (code <= 55)              return '🌦️';
  if (code <= 65)              return '🌧️';
  if (code <= 77)              return '❄️';
  if (code <= 82)              return '🌧️';
  if (code <= 86)              return '🌨️';
  return '⛈️';
}

// ── API: Buienradar (huidig weer) ───────────────────
async function fetchBuienradar() {
  const r = await fetch('https://data.buienradar.nl/2.0/feed/json');
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── API: Open-Meteo (locatie-specifieke verwachting) ─
async function fetchForecast(loc) {
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${loc.lat}&longitude=${loc.lon}`
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min'
    + '&timezone=Europe%2FAmsterdam&forecast_days=5';
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  return d.daily;
}

// ── Render ──────────────────────────────────────────
function renderPlaceholders() {
  document.getElementById('grid').innerHTML = LOCATIONS.map(loadingTile).join('');
}

async function loadAll() {
  const tiles = Array.from(document.getElementById('grid').querySelectorAll('.tile'));

  // Haal Buienradar (huidig) en alle locatie-forecasts parallel op
  let buienradarData;
  try {
    buienradarData = await fetchBuienradar();
  } catch(e) {
    console.error('Buienradar ophalen mislukt:', e);
    LOCATIONS.forEach((loc, i) => {
      const w = document.createElement('div');
      w.innerHTML = errorTile(loc);
      tiles[i].replaceWith(w.firstElementChild);
    });
    document.getElementById('status-text').textContent = 'Verbinding mislukt — probeer het later opnieuw';
    return;
  }

  const staties = buienradarData.actual.stationmeasurements;

  // Per locatie: combineer Buienradar-station + Open-Meteo forecast
  // Spreid verzoeken met 150ms tussenpoos om rate-limiting te voorkomen
  await Promise.all(LOCATIONS.map(async (loc, i) => {
    await new Promise(res => setTimeout(res, i * 150));
    try {
      const station = dichtstbij(staties, loc);
      if (!station) throw new Error('Geen station gevonden');

      // Forecast apart ophalen — bij falen tonen we huidig weer mét lege forecast
      let fcData = null;
      try {
        fcData = await fetchForecast(loc);
      } catch(fe) {
        console.warn(`Forecast ${loc.name} mislukt:`, fe);
      }

      const w = document.createElement('div');
      w.innerHTML = buildTile(loc, station, fcData);
      tiles[i].replaceWith(w.firstElementChild);
    } catch(e) {
      console.warn(loc.name, e);
      const w = document.createElement('div');
      w.innerHTML = errorTile(loc);
      tiles[i].replaceWith(w.firstElementChild);
    }
  }));

  const t = new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('status-text').textContent =
    `Bijgewerkt om ${t} · Volgende verversing over 10 minuten`;
}

// ── Start ───────────────────────────────────────────
fitScreen();
window.addEventListener('resize', fitScreen);
tickClock();
setInterval(tickClock, 1000);
renderPlaceholders();
loadAll();
setInterval(() => { renderPlaceholders(); loadAll(); }, REFRESH_MS);
</script>
</body>
</html>
